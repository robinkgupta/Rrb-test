<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#5b6578;--br:#d5dbe8;--pr:#1f4fd8;--ok:#1a8f4c;--no:#d1382f;--wa:#e8a100;--gr:#c9cfdc}
@media(prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1a2030;--tx:#e7ebf4;--mu:#9aa5bb;--br:#2e374c;--pr:#6c93ff;--ok:#3fc27a;--no:#ff6b61;--wa:#ffc23d;--gr:#3a435a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Devanagari","Mangal","Nirmala UI",system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--br);padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:1rem;margin:0}.wrap{max-width:1050px;margin:0 auto;padding:14px}
#timer{font:700 1.3rem/1 ui-monospace,Consolas,monospace;padding:7px 12px;border-radius:8px;border:2px solid var(--br)}
#timer.warn{color:#fff;background:var(--no);border-color:var(--no);animation:bl 1s infinite}@keyframes bl{50%{opacity:.55}}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 290px;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--br);background:var(--card);color:var(--tx);padding:9px 14px}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.d{background:var(--no);color:#fff;border-color:var(--no)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 12px;border-width:2px}.opt.sel{border-color:var(--pr);background:rgba(31,79,216,.12)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar .sp{flex:1}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.pal button{padding:7px 0;font-weight:700;background:var(--gr);border-color:var(--gr)}
.pal .v{background:#f6c9c5;border-color:#f6c9c5;color:#7a1a14}.pal .a{background:var(--ok);border-color:var(--ok);color:#fff}.pal .c{outline:3px solid var(--pr);outline-offset:1px}
.lg{font-size:.85rem;color:var(--mu);margin-top:10px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 8px;vertical-align:middle}
.st{display:flex;gap:8px;margin-bottom:10px}.st div{flex:1;text-align:center;border:1px solid var(--br);border-radius:8px;padding:6px}.st b{display:block;font-size:1.2rem}
.tag{font-size:.78rem;background:var(--br);border-radius:99px;padding:2px 9px;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stats div{text-align:center;border:1px solid var(--br);border-radius:10px;padding:10px}.stats b{display:block;font-size:1.5rem}
.ro{margin:7px 0;padding:9px 11px;border-radius:8px;border:1px solid var(--br)}.ro.ok{border-color:var(--ok);background:rgba(26,143,76,.13)}.ro.bad{border-color:var(--no);background:rgba(209,56,47,.12)}
.ro small{display:block;color:var(--mu)}.cpt{background:rgba(232,161,0,.15);border-left:4px solid var(--wa);padding:8px 12px;border-radius:6px;margin:8px 0}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--br);padding:6px;text-align:center}
.ok-t{color:var(--ok);font-weight:700}.no-t{color:var(--no);font-weight:700}.sk-t{color:var(--mu);font-weight:700}
.hide{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.modal .card{max-width:420px;margin:0}
</style>

<header><h1>RRB Technician Science Quiz – 7 October, Second Shift</h1><div id="timer" class="hide">20:00</div></header>
<div class="wrap" id="app"></div>
<script>
const Q=[{"n": 51, "s": "जीव विज्ञान", "q": "मनुष्यों में अनचाही सगर्भता को रोकने के लिए निम्नलिखित में से किस विधि का उपयोग किया जाता है?", "o": ["गर्भनिरोधकों का उपयोग", "नियमित व्यायाम", "उचित पोषण", "टीकाकरण"], "a": 0, "c": "गर्भनिरोधक (कंडोम, कॉपर-T, गोलियाँ आदि) शुक्राणु-अंडाणु के मिलन या भ्रूण के गर्भाशय में रोपण को रोकते हैं।", "e": ["सही – यही गर्भधारण रोकने की विधि है।", "व्यायाम स्वास्थ्य सुधारता है, गर्भ नहीं रोकता।", "पोषण शरीर की वृद्धि व ऊर्जा के लिए है, गर्भनिरोध के लिए नहीं।", "टीकाकरण रोगों से बचाता है, गर्भ से नहीं।"]}, {"n": 52, "s": "जीव विज्ञान", "q": "हाइड्रोपोनिक सिस्टम में जहाँ प्रकाश एक तरफ से आ रहा हो, बीन्स के पौधों की अधिकतम ऊर्ध्वाधर वृद्धि के लिए कौन सी रणनीति अपनाई जाएगी?", "o": ["समग्र वृद्धि को त्‍वरित करने के लिए अतिरिक्त पोषक तत्वों को मिलाना", "तने को मजबूत करने के लिए केवल कृत्रिम पवन का उपयोग करना", "समान रूप से प्रकाश उद्भासन के लिए पौधों को नियमित रूप से घुमाना", "पौधों को एकल प्रकाश के अधीन स्‍थायी रखना"], "a": 2, "c": "प्रकाश एक ओर से आए तो पौधा उसी ओर झुकता है (प्रकाशानुवर्तन)। पौधों को नियमित घुमाने से हर ओर समान प्रकाश मिलता है और वृद्धि सीधी रहती है।", "e": ["पोषक तत्व बढ़ाने से प्रकाश की असमानता दूर नहीं होती।", "कृत्रिम पवन तने को मोटा करती है, पर झुकाव की समस्या नहीं सुलझाती।", "सही – समान प्रकाश से ऊर्ध्वाधर वृद्धि अधिकतम होती है।", "एक ही प्रकाश-स्रोत में स्थायी रखने पर पौधा झुक जाएगा।"]}, {"n": 53, "s": "जीव विज्ञान", "q": "परागण के पश्चात पराग नलिका का मुख्य कार्य क्या है?", "o": ["पुष्पों को कीटों से बचाना", "नर युग्मकों को बीजांड तक ले जाना", "परागकों के लिए मकरंद उत्पादित करना", "फल भित्ति में विकसित होना"], "a": 1, "c": "परागण के बाद परागकण वर्तिकाग्र पर अंकुरित होकर पराग नलिका बनाता है, जो वर्तिका से होकर बीजांड तक जाती है और नर युग्मक पहुँचाकर निषेचन कराती है।", "e": ["कीटों से बचाव पराग नलिका का काम नहीं है।", "सही – नर युग्मकों को बीजांड तक ले जाना ही इसका मुख्य कार्य है।", "मकरंद पुष्प की मकरंद-ग्रंथियाँ बनाती हैं।", "फल-भित्ति अंडाशय की दीवार से बनती है, पराग नलिका से नहीं।"]}, {"n": 54, "s": "रसायन विज्ञान", "q": "भिन्न-भिन्न क्वथनांक वाले दो मिश्रणीय द्रवों के मिश्रण को पृथक करने के लिए सामान्यतः किस विधि का उपयोग किया जाता है?", "o": ["आसवन", "अवसादन", "निस्यंदन", "वर्णलेखिकी"], "a": 0, "c": "जब दो मिश्रणीय द्रवों के क्वथनांक अलग हों, तो कम क्वथनांक वाला पहले वाष्पित होकर संघनित होता है – इसे आसवन कहते हैं।", "e": ["सही – क्वथनांक के अंतर पर आधारित विधि।", "अवसादन में अघुलनशील भारी कण नीचे बैठते हैं।", "निस्यंदन ठोस-द्रव को अलग करता है; मिश्रणीय द्रव छन्ने से साथ निकल जाएँगे।", "वर्णलेखिकी रंगों/घटकों की सूक्ष्म मात्रा अलग करने की विधि है, सामान्यतः द्रवों के लिए नहीं।"]}, {"n": 55, "s": "रसायन विज्ञान", "q": "निम्नलिखित में से कौन-सा, विषमांगी मिश्रण का सर्वोत्तम उदाहरण है?", "o": ["रेत और लोहे का चूर्ण", "लवण जल", "सिरका", "वायु"], "a": 0, "c": "विषमांगी मिश्रण में संघटन हर जगह एक-सा नहीं होता और घटक अलग-अलग दिखते हैं। समांगी मिश्रण में संघटन समान रहता है।", "e": ["सही – रेत और लोहे का चूर्ण अलग-अलग दिखते हैं (चुंबक से पृथक होते हैं)।", "लवण जल समांगी मिश्रण (विलयन) है।", "सिरका जल में एसिटिक अम्ल का समांगी विलयन है।", "वायु गैसों का समांगी मिश्रण है।"]}, {"n": 56, "s": "भौतिक विज्ञान", "q": "एक वस्तु को 15 cm फोकस दूरी वाले एक अपसारी लेंस से 10 cm की दूरी पर रखा गया है। निर्मित प्रतिबिंब की स्थिति क्या है?", "o": ["लेंस के दूसरी ओर उससे 15 cm की दूरी पर", "लेंस के दूसरी ओर उससे 8.6 cm की दूरी पर", "वस्तु की ओर लेंस से 6 cm की दूरी पर", "लेंस के दूसरी ओर उससे 30 cm की दूरी पर"], "a": 2, "c": "अपसारी (अवतल) लेंस में f = −15 cm, u = −10 cm। 1/v = 1/f + 1/u = −1/15 − 1/10 = −1/6, अतः v = −6 cm। ऋणात्मक चिह्न का अर्थ है प्रतिबिंब वस्तु की ही ओर बनता है (आभासी, सीधा, छोटा)।", "e": ["अवतल लेंस दूसरी ओर प्रतिबिंब नहीं बनाता; 15 cm केवल फोकस दूरी है।", "दूरी 8.6 cm गलत गणना से आती है और दूसरी ओर बताना भी गलत है।", "सही – वस्तु की ओर लेंस से 6 cm पर आभासी प्रतिबिंब बनता है।", "30 cm किसी सही सूत्र-गणना से नहीं आता; अवतल लेंस वास्तविक प्रतिबिंब नहीं बनाता।"]}, {"n": 57, "s": "भौतिक विज्ञान", "q": "'X' kg द्रव्यमान का पिंड जब 2 m/s के वेग से गतिमान होता है तो इसकी गतिज ऊर्जा 200 J होती है । X का मान क्या होगा?", "o": ["50 kg", "200 kg", "400 kg", "100 kg"], "a": 3, "c": "गतिज ऊर्जा KE = ½ m v²। 200 = ½ × X × 2² = 2X, इसलिए X = 100 kg।", "e": ["50 kg तब मिलता जब सूत्र में ½ की जगह 1 लिखकर 200 = X×4 हल करते; यह गलत है।", "200 kg रखने पर KE = ½×200×4 = 400 J होगी।", "400 kg रखने पर KE = ½×400×4 = 800 J होगी।", "सही – ½×100×4 = 200 J।"]}, {"n": 58, "s": "भौतिक विज्ञान", "q": "एकसमान मंदन के साथ गतिमान किसी पिंड का वेग-समय ग्राफ किस प्रकार का होता है?", "o": ["नीचे की ओर प्रवणता वाली एक सरल रेखा", "समय अक्ष के समानांतर एक सरल रेखा", "ऊपर की ओर प्रवणता वाली एक सरल रेखा", "एक वक्र रेखा"], "a": 0, "c": "एकसमान मंदन में वेग समान दर से घटता है (v = u − at), इसलिए v–t ग्राफ नीचे की ओर ढलान वाली सरल रेखा होता है।", "e": ["सही – घटते वेग को दर्शाने वाली ढलवाँ रेखा।", "समय अक्ष के समांतर रेखा नियत वेग दर्शाती है।", "ऊपर की ओर ढलान वाली रेखा एकसमान त्वरण दर्शाती है।", "वक्र रेखा असमान त्वरण/मंदन में बनती है।"]}, {"n": 59, "s": "भौतिक विज्ञान", "q": "सरल रेखा में चलते समय, एक छात्र 50 सेकंड में तय की गई कुल दूरी को 200 मीटर के रूप में, और विस्थापन को 120 मीटर के रूप में दर्ज करता है। कौन-सा कथन, इस स्थिति में औसत चाल और औसत वेग के संबंध को सर्वोत्तम रूप से वर्णित करता है?", "o": ["औसत वेग, औसत चाल से अधिक है क्योंकि विस्थापन, दूरी से कम है", "औसत चाल, औसत वेग के बराबर है क्योंकि दोनों की गणना एकसमान समयावधि में की गई है", "औसत चाल, औसत वेग से कम है क्योंकि विस्थापन, दूरी से कम है", "औसत चाल, औसत वेग से अधिक है क्योंकि कुल दूरी, विस्थापन से अधिक है"], "a": 3, "c": "औसत चाल = कुल दूरी/समय = 200/50 = 4 m/s। औसत वेग = विस्थापन/समय = 120/50 = 2.4 m/s। दूरी, विस्थापन से अधिक है, इसलिए औसत चाल अधिक है।", "e": ["विस्थापन कम होने से औसत वेग कम होता है, अधिक नहीं।", "दूरी और विस्थापन भिन्न हैं, इसलिए दोनों बराबर नहीं हैं।", "औसत चाल कम नहीं, अधिक है (4 > 2.4)।", "सही – कुल दूरी विस्थापन से अधिक है।"]}, {"n": 60, "s": "जीव विज्ञान", "q": "कौन-सा कथन महासागरों और वायुमंडल में मौजूद कार्बन की मात्रा की सटीक तुलना करता है?", "o": ["महासागर, वायुमंडल की तुलना में कार्बन के अत्‍यंत बड़े भंडार के रूप में कार्य करते हैं", "वायुमंडल और महासागर समान मात्रा में कार्बन संग्रहित करते हैं", "पृथ्वी पर महासागरों की तुलना में वायुमंडल सबसे बड़ा कार्बन भंडार है", "महासागर वैश्विक कार्बन की कुल मात्रा का केवल एक मामूली प्रतिशत ही संग्रहित करते हैं"], "a": 0, "c": "कार्बन चक्र में महासागरों में घुला कार्बन (मुख्यतः बाइकार्बोनेट के रूप में) वायुमंडल की तुलना में कई गुना अधिक है, इसलिए महासागर बहुत बड़ा भंडार हैं।", "e": ["सही – महासागर वायुमंडल से बहुत अधिक कार्बन रखते हैं।", "दोनों में मात्रा बराबर नहीं है।", "वायुमंडल महासागरों से छोटा भंडार है।", "महासागर कार्बन का बड़ा हिस्सा संग्रहित करते हैं, मामूली नहीं।"]}, {"n": 61, "s": "भौतिक विज्ञान", "q": "परावर्तन के बाद प्रकाश की एक किरण अवतल दर्पण के वक्रता के केंद्र से होकर गुजरती है। यह किस पथ का अनुसरण करेगी और क्यों?", "o": ["यह अपने पथ पर वापस लौट आएगी क्योंकि क्योंकि यह पृष्ठ के समकोण पर दर्पण से टकराती है।", "परावर्तन के बाद यह अपसरित हो जाएगी क्योंकि अवतल दर्पण किरणों को पृष्ठ से प्रसारित करती है।", "यह मुख्य अक्ष के समांतर निकलेगी क्योंकि वक्रता केंद्र से होकर आपतित होने वाली किरणें परावर्तन के बाद समांतर हो जाती हैं।", "यह मुख्य फोकस पर अभिसरित होगी क्योंकि वक्रता केंद्र से गुजरने वाली किरणें परावर्तन के बाद सदैव फोकस पर मिलती हैं।"], "a": 0, "c": "वक्रता केंद्र से गुजरने वाली किरण दर्पण के पृष्ठ पर अभिलंबवत (90°) पड़ती है। आपतन कोण 0° होने से परावर्तन कोण भी 0° होता है और किरण उसी पथ पर लौट जाती है।", "e": ["सही – अभिलंबवत आपतित किरण अपने पथ पर वापस लौटती है।", "अवतल दर्पण किरणों को अभिसारी बनाता है, अपसारी नहीं।", "मुख्य अक्ष के समांतर वही किरण निकलती है जो फोकस से गुजरकर आती है।", "फोकस पर वे किरणें मिलती हैं जो मुख्य अक्ष के समांतर आती हैं, वक्रता केंद्र वाली नहीं।"]}, {"n": 62, "s": "रसायन विज्ञान", "q": "एक रसायनज्ञ, बालू और पंकिल जल के मिश्रण को पृथक करना चाहता है। वह इसे पूरा करने के लिए एक निस्यंद पेपर और एक फनल का उपयोग करता है। निलंबन के गुणधर्मों के आधार पर, यह विधि प्रभावी क्यों है, के बारे में कौन-सा कथन सही है?", "o": ["सभी मिश्रणों को केवल चुंबक का उपयोग करके पृथक किया जा सकता है।", "निलंबन को निस्यंदन द्वारा पृथक नहीं किया जा सकता है और इसमें वाष्पन की आवश्यकता होती है।", "निलंबन में कण, जल में संपूर्ण रूप से विलीन हो जाते हैं।", "निलंबन में कण इतने बड़े होते हैं कि वे निस्यंद पेपर द्वारा ट्रैप हो जाते हैं।"], "a": 3, "c": "बालू-पंकिल जल निलंबन है। निलंबन के कण बड़े होते हैं, घुलते नहीं, इसलिए निस्यंदन पेपर पर रुक जाते हैं और जल छनकर निकल जाता है।", "e": ["चुंबक केवल चुंबकीय पदार्थ अलग करता है, सभी मिश्रण नहीं।", "निलंबन निस्यंदन से ही अलग हो जाता है; वाष्पन आवश्यक नहीं।", "निलंबन के कण जल में घुलते नहीं, तैरते रहते हैं।", "सही – कण बड़े होने के कारण छन्ने में फँस जाते हैं।"]}, {"n": 63, "s": "भौतिक विज्ञान", "q": "कक्षा में किए गए एक प्रयोग में, एक विद्यार्थी स्वरित्र द्विभुज पर आघात करने के बाद उसकी भुजाओं (prongs) को कसकर पकड़ता है और ध्यान से सुनता है। कोई ध्वनि सुनाई नहीं देती है। इस प्रेक्षण के लिए सबसे सटीक स्पष्टीकरण कौन-सा है?", "o": ["ध्वनि उत्पन्न करने हेतु इसे बहुत हल्के से आघात किया गया था", "स्वरित्र द्विभुज, धातु का बना होता है", "आस-पास की वायु, ध्वनि को अवरुद्ध कर देती है", "कंपन, हाथ द्वारा अवशोषित हो जाते हैं"], "a": 3, "c": "स्वरित्र द्विभुज के कंपन से ध्वनि बनती है। भुजाएँ कसकर पकड़ने पर कंपन हाथ द्वारा अवशोषित (अवमंदित) हो जाते हैं और ध्वनि नहीं सुनाई देती।", "e": ["प्रश्न में आघात के बाद भुजाएँ पकड़ने की बात है; हल्का आघात कारण नहीं है।", "धातु का होना ध्वनि न आने का कारण नहीं, धातु अच्छी ध्वनि देती है।", "वायु ध्वनि का माध्यम है, उसे अवरुद्ध नहीं करती।", "सही – हाथ कंपन सोख लेता है।"]}, {"n": 64, "s": "रसायन विज्ञान", "q": "कौन-सा कथन जल में साबुन द्वारा बनाए गए मिसेल के कार्य का सर्वोत्‍तम रूप से वर्णन करता है?", "o": ["मिसेल केवल जल की अनुपस्थिति में बनते हैं", "मिसेल निर्मलन के लिए जल अणुओं को आयनों में तोड़ देते हैं", "मिसेल तैलीय गंदगी को अपने अध्रुवीय केंद्रों के भीतर फं सा लेते हैं और जल में फै ला देते हैं", "मिसेल गंदगी को विलीन करने के लिए जल का pH बदल देते हैं"], "a": 2, "c": "साबुन के अणु का एक सिरा जल-स्नेही (आयनिक) और दूसरा जल-विरोधी (हाइड्रोकार्बन) होता है। जल में ये मिसेल बनाते हैं, जिनके भीतर तैलीय गंदगी फँस जाती है और जल के साथ धुल जाती है।", "e": ["मिसेल जल की उपस्थिति में ही बनते हैं।", "जल के अणु आयनों में नहीं टूटते; मिसेल केवल गंदगी घेरते हैं।", "सही – अध्रुवीय केंद्र गंदगी को फँसाकर जल में फैला देता है।", "साबुन से जल का pH मुख्य सफाई-क्रिया नहीं है।"]}, {"n": 65, "s": "जीव विज्ञान", "q": "कोई छात्र दो अकशेरुकी प्राणियों का अवलोकन करता है—एक में पेशीय पाद है, जबकि दूसरे में काइटिनी बहिःकंकाल है। ये जीव किस संघ (phyla) से संबंधित हैं?", "o": ["ऐनेलिडा और आर्थ्रोपोडा", "ऐनेलिडा तथा एकाइनोडर्मेटा", "मोलस्का और आर्थ्रोपोडा", "एकाइनोडर्मेटा और मोलस्का"], "a": 2, "c": "पेशीय पाद मोलस्का (घोंघा, सीप) की पहचान है और काइटिनी बहिःकंकाल आर्थ्रोपोडा (कीट, झींगा) की।", "e": ["ऐनेलिडा (केंचुआ) में पेशीय पाद नहीं होता।", "ऐनेलिडा में पेशीय पाद नहीं और इकाइनोडर्मेटा में काइटिनी बहिःकंकाल नहीं होता।", "सही – मोलस्का में पेशीय पाद, आर्थ्रोपोडा में काइटिनी बहिःकंकाल।", "इकाइनोडर्मेटा (तारामीन) में काइटिनी बहिःकंकाल नहीं होता।"]}, {"n": 66, "s": "रसायन विज्ञान", "q": "ऐलुमिनियम के पृष्ठीय उपचार की प्रक्रिया के दौरान इसके ऐनोडीकरण का मुख्य उद्देश्य क्या है?", "o": ["ऐलुमिनियम की विद्युत चालकता को बढ़ाना।", "ऐलुमिनियम को मिश्र धातु में परि‍वर्तित करना।", "संक्षारण से बचने के लिए मोटी ऑक्साइड परत का निर्माण करना।", "पृष्ठ से ऑक्साइड परत को पूर्णत: हटा देना।"], "a": 2, "c": "ऐनोडीकरण में ऐलुमिनियम को ऐनोड बनाकर तनु सल्फ्यूरिक अम्ल में विद्युत-अपघटन किया जाता है। इससे मोटी, टिकाऊ ऑक्साइड परत बनती है जो संक्षारण से बचाती है और रंगी भी जा सकती है।", "e": ["ऑक्साइड परत कुचालक है, इसलिए चालकता नहीं बढ़ती।", "इसमें मिश्र धातु नहीं बनती।", "सही – संक्षारण-रोधी मोटी ऑक्साइड परत बनाना उद्देश्य है।", "उद्देश्य परत हटाना नहीं, बनाना है।"]}, {"n": 67, "s": "जीव विज्ञान", "q": "बढ़ते अपशिष्ट के प्रबंधन के लिए एक शहर एक लैंडफिल बनाने की योजना बना रहा है जो एक नदी और खेत के निकट है। कौन-सी रणनीति, शहरी विकास का समर्थन करते हुए पारिस्थितिकी तंत्र की सर्वोत्तम रूप से रक्षा करती है?", "o": ["लैंडफिल अपशिष्ट कम करने के लिए नदी के निकट भस्मित्र बनाना।", "बिना किसी अतिरिक्त उपाय के लैंडफिल को किसी दूर-दराज के ग्रामीण क्षेत्र में ले जाना।", "अंतिम उपाय के रूप में शहर के कचरे को सीधे नदी और खेतों में फेंकना।", "सुरक्षात्मक आस्तरों के साथ लैंडफिल बनाना और सामुदायिक पुन:चक्रण कार्यक्रमों को वित्त पोषित करना।"], "a": 3, "c": "सतत विकास में पर्यावरण-सुरक्षा और विकास साथ चलते हैं। सुरक्षात्मक आस्तर वाला लैंडफिल रिसाव रोकता है और पुनर्चक्रण से कचरा घटता है।", "e": ["नदी के पास भस्मित्र वायु व जल प्रदूषण बढ़ाएगा।", "केवल दूर ले जाने से समस्या स्थानांतरित होती है, हल नहीं होती।", "कचरा सीधे नदी-खेतों में फेंकना गंभीर प्रदूषण है।", "सही – आस्तर और पुनर्चक्रण से पारिस्थितिकी तंत्र सुरक्षित रहता है।"]}, {"n": 68, "s": "रसायन विज्ञान", "q": "किस कार्बन यौगिक में योगात्‍मक अभिक्रिया (addition reaction) होने की संभावना सबसे कम है?", "o": ["पेन्टाइन (Pentyne)", "पेन्टेन (Pentane)", "पेन्टाडाइईन (Pentadiene)", "पेन्टीन (Pentene)"], "a": 1, "c": "योगात्मक अभिक्रिया असंतृप्त यौगिकों (द्विबंध/त्रिबंध वाले) में होती है। संतृप्त हाइड्रोकार्बन (केवल एकल बंध) में यह प्रायः नहीं होती।", "e": ["पेन्टाइन में त्रिबंध है, योगात्मक अभिक्रिया आसान है।", "सही – पेन्टेन (C₅H₁₂) संतृप्त है, इसलिए योगात्मक अभिक्रिया की संभावना सबसे कम है।", "पेन्टाडाइईन में दो द्विबंध हैं, अभिक्रिया होती है।", "पेन्टीन में एक द्विबंध है, अभिक्रिया होती है।"]}, {"n": 69, "s": "भौतिक विज्ञान", "q": "किसी धारावाही चालक को एक चुंबकीय क्षेत्र में रखा गया है जो ऊर्ध्‍वाधर रूप से अधोगामी है। चालक को पश्चिम से पूर्व की ओर क्षैतिज रूप से अभिविन्यस्त किया गया है। चालक पर लगने वाला बल ________________ होगा।", "o": ["पूर्व की ओर", "पश्चिम की ओर", "दक्षिण की ओर", "उत्तर की ओर"], "a": 3, "c": "चुंबकीय क्षेत्र में धारावाही चालक पर बल F = I L × B दिशा में लगता है (फ्लेमिंग का बायाँ हाथ नियम)। धारा पूर्व की ओर, क्षेत्र नीचे की ओर हो तो बल उत्तर की ओर होता है।", "e": ["बल धारा की दिशा में नहीं, उसके लंबवत लगता है।", "पश्चिम धारा की विपरीत दिशा है; बल धारा के लंबवत होता है।", "दक्षिण दिशा बल की विपरीत दिशा है।", "सही – नियम से बल उत्तर की ओर आता है।"]}, {"n": 70, "s": "जीव विज्ञान", "q": "निम्नलिखित में से कौन-स const KEY='rrb_sci_7oct_s2_v1',TOTAL=1200,WARN=300,N=Q.length,L=['A','B','C','D'];
let mem=null,st=load(),tick=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||mem}catch(e){return mem}}
function save(){mem=JSON.parse(JSON.stringify(st));try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const $=id=>document.getElementById(id),app=$('app'),tm=$('timer');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function oh(q,i){return q.h?q.o[i]:esc(q.o[i])}
function newTest(){st={phase:'run',end:Date.now()+TOTAL*1000,ans:{},vis:{0:1},cur:0};save();run()}
function remain(){return Math.max(0,Math.ceil((st.end-Date.now())/1000))}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><h2>निर्देश</h2><ul><li>कुल प्रश्न: ${N} (भौतिक, रसायन और जीव विज्ञान) – RRB Technician Gr-III, 7 अक्टूबर 2026, Second Shift (12:45 PM)।</li><li>समय: ठीक 20 मिनट। समय समाप्त होते ही टेस्ट अपने-आप जमा हो जाएगा।</li><li>अंकन: सही उत्तर पर +1, गलत उत्तर पर −1/3 (मूल PDF में दिया गया नियम)। उत्तर न देने पर 0।</li><li>पेज Refresh करने पर बचा हुआ समय और आपके उत्तर सुरक्षित रहेंगे।</li><li>उत्तर कुंजी और व्याख्या टेस्ट जमा करने के बाद ही दिखेगी।</li></ul><button class="p" onclick="newTest()">टेस्ट शुरू करें</button></div>`;tm.classList.add('hide')}
function run(){tm.classList.remove('hide');draw();clearInterval(tick);tick=setInterval(tk,250);tk()}
function tk(){const r=remain();tm.textContent=fmt(r);tm.classList.toggle('warn',r<=WARN);if(r<=0){clearInterval(tick);submit(true)}}
function stat(){let a=Object.keys(st.ans).length;return[a,N-a]}
function draw(){const q=Q[st.cur],[a,u]=stat(),i=st.cur;st.vis[i]=1;save();
 let pal='';Q.forEach((x,j)=>{const c=(st.ans[j]!==undefined?'a':st.vis[j]?'v':'')+(j===i?' c':'');pal+=`<button class="${c}" onclick="go(${j})">${j+1}</button>`});
 app.innerHTML=`<div class="grid"><div class="card"><div><b>प्रश्न ${i+1} / ${N}</b><span class="tag">${q.s}</span></div><p style="font-size:1.08rem">${esc(q.q)}</p><div>${q.o.map((_,k)=>`<button class="opt ${st.ans[i]===k?'sel':''}" onclick="pick(${k})"><b>${L[k]}.</b> ${oh(q,k)}</button>`).join('')}</div><div class="bar"><button onclick="go(${i-1})" ${i?'':'disabled'}>← Previous</button><button onclick="go(${i+1})" ${i<N-1?'':'disabled'}>Next →</button><button onclick="clr()">Clear Response</button><span class="sp"></span><button class="d" onclick="ask()">Submit Test</button></div></div>
 <div class="card"><div class="st"><div><b style="color:var(--ok)">${a}</b>Attempted</div><div><b style="color:var(--no)">${u}</b>Unattempted</div></div><div class="pal">${pal}</div><div class="lg"><i style="background:var(--ok)"></i>उत्तर दिया<i style="background:#f6c9c5"></i>देखा, उत्तर नहीं<i style="background:var(--gr)"></i>नहीं देखा</div></div></div>`}
function go(j){if(j<0||j>=N)return;st.cur=j;draw()}
function pick(k){st.ans[st.cur]=k;draw()}
function clr(){delete st.ans[st.cur];draw()}
function ask(){const [a,u]=stat(),m=document.createElement('div');m.className='modal';m.id='mod';m.innerHTML=`<div class="card"><h3>टेस्ट जमा करें?</h3><p>Attempted: ${a} | Unattempted: ${u}<br>जमा करने के बाद उत्तर बदले नहीं जा सकेंगे।</p><div class="bar"><button onclick="$('mod').remove()">वापस जाएँ</button><span class="sp"></span><button class="d" onclick="submit(false)">हाँ, जमा करें</button></div></div>`;document.body.appendChild(m)}
function calc(ans){let c=0,w=0,s=0;Q.forEach((q,i)=>{if(ans[i]===undefined)s++;else if(ans[i]===q.a)c++;else w++});
 const sc=Math.round((c-w/3)*100)/100,att=c+w;return{c,w,s,sc,acc:att?Math.round(c/att*1000)/10:0}}
function submit(auto){clearInterval(tick);const m=$('mod');if(m)m.remove();st.phase='done';st.auto=!!auto;save();result()}
let flt='all';
function result(){tm.classList.add('hide');const r=calc(st.ans);
 const sub={};Q.forEach((q,i)=>{const o=sub[q.s]||(sub[q.s]={t:0,c:0,w:0});o.t++;if(st.ans[i]!==undefined){st.ans[i]===q.a?o.c++:o.w++}});
 let rev='';Q.forEach((q,i)=>{const u=st.ans[i],stt=u===undefined?'s':u===q.a?'c':'w';if(flt!=='all'&&flt!==stt)return;
  rev+=`<div class="card"><b>प्रश्न ${i+1}</b><span class="tag">${q.s}</span> <span class="${stt=='c'?'ok-t':stt=='w'?'no-t':'sk-t'}">${stt=='c'?'सही':stt=='w'?'गलत':'छोड़ा गया'}</span><p>${esc(q.q)}</p>${q.o.map((_,k)=>`<div class="ro ${k===q.a?'ok':u===k?'bad':''}"><b>${L[k]}.</b> ${oh(q,k)} ${k===q.a?'✔ सही उत्तर':''}${u===k&&k!==q.a?'✘ आपका उत्तर':''}${u===k&&k===q.a?' (आपका उत्तर)':''}<small>${esc(q.e[k])}</small></div>`).join('')}<div class="cpt"><b>अवधारणा:</b> ${esc(q.c)}</div></div>`});
 app.innerHTML=`<div class="card"><h2>परिणाम ${st.auto?'(समय समाप्त – Auto-Submit)':''}</h2><div class="stats"><div><b>${r.sc}/${N}</b>कुल स्कोर</div><div><b class="ok-t">${r.c}</b>सही</div><div><b class="no-t">${r.w}</b>गलत</div><div><b>${r.s}</b>छोड़े गए</div><div><b>${r.acc}%</b>Accuracy</div></div><p style="color:var(--mu)">स्कोर = सही − (गलत ÷ 3)। Accuracy = सही ÷ किए गए प्रश्न × 100।</p>
 <table><tr><th>विषय</th><th>प्रश्न</th><th>सही</th><th>गलत</th></tr>${Object.keys(sub).map(k=>`<tr><td>${k}</td><td>${sub[k].t}</td><td>${sub[k].c}</td><td>${sub[k].w}</td></tr>`).join('')}</table>
 <div class="bar"><button class="p" onclick="newTest()">Retake (नया 20:00 Timer)</button><span class="sp"></span>${[['all','सभी'],['w','गलत'],['s','छोड़े गए'],['c','सही']].map(f=>`<button ${flt===f[0]?'class="p"':''} onclick="flt='${f[0]}';result()">${f[1]}</button>`).join('')}</div></div>${rev}`}
if(!st)start();else if(st.phase==='done')result();else if(remain()<=0)submit(true);else run();
</script>
</body>
</html>
