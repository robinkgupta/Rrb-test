<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#5b6578;--br:#d5dbe8;--pr:#1f4fd8;--ok:#1a8f4c;--no:#d1382f;--wa:#e8a100;--gr:#c9cfdc}
@media(prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1a2030;--tx:#e7ebf4;--mu:#9aa5bb;--br:#2e374c;--pr:#6c93ff;--ok:#3fc27a;--no:#ff6b61;--wa:#ffc23d;--gr:#3a435a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Devanagari","Mangal","Nirmala UI",system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--br);padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:1rem;margin:0}.wrap{max-width:1050px;margin:0 auto;padding:14px}
#timer{font:700 1.3rem/1 ui-monospace,Consolas,monospace;padding:7px 12px;border-radius:8px;border:2px solid var(--br)}
#timer.warn{color:#fff;background:var(--no);border-color:var(--no);animation:bl 1s infinite}@keyframes bl{50%{opacity:.55}}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 290px;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--br);background:var(--card);color:var(--tx);padding:9px 14px}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.d{background:var(--no);color:#fff;border-color:var(--no)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 12px;border-width:2px}.opt.sel{border-color:var(--pr);background:rgba(31,79,216,.12)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar .sp{flex:1}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.pal button{padding:7px 0;font-weight:700;background:var(--gr);border-color:var(--gr)}
.pal .v{background:#f6c9c5;border-color:#f6c9c5;color:#7a1a14}.pal .a{background:var(--ok);border-color:var(--ok);color:#fff}.pal .c{outline:3px solid var(--pr);outline-offset:1px}
.lg{font-size:.85rem;color:var(--mu);margin-top:10px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 8px;vertical-align:middle}
.st{display:flex;gap:8px;margin-bottom:10px}.st div{flex:1;text-align:center;border:1px solid var(--br);border-radius:8px;padding:6px}.st b{display:block;font-size:1.2rem}
.tag{font-size:.78rem;background:var(--br);border-radius:99px;padding:2px 9px;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stats div{text-align:center;border:1px solid var(--br);border-radius:10px;padding:10px}.stats b{display:block;font-size:1.5rem}
.ro{margin:7px 0;padding:9px 11px;border-radius:8px;border:1px solid var(--br)}.ro.ok{border-color:var(--ok);background:rgba(26,143,76,.13)}.ro.bad{border-color:var(--no);background:rgba(209,56,47,.12)}
.ro small{display:block;color:var(--mu)}.cpt{background:rgba(232,161,0,.15);border-left:4px solid var(--wa);padding:8px 12px;border-radius:6px;margin:8px 0}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--br);padding:6px;text-align:center}
.ok-t{color:var(--ok);font-weight:700}.no-t{color:var(--no);font-weight:700}.sk-t{color:var(--mu);font-weight:700}
.hide{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.modal .card{max-width:420px;margin:0}

<header><h1>RRB Technician Science Quiz – 8 October, Second Shift</h1><div id="timer" class="hide">20:00</div></header>
<div class="wrap" id="app"></div>
<script>
const Q=[{"n": 51, "s": "जीव विज्ञान", "q": "पृथ्वी पर अधिकांश मौसमी परिघटनाओं के लिए वायुमंडल की कौन-सी परत मुख्य रूप से उत्तरदायी है?", "o": ["क्षोभमंडल", "समतापमंडल", "तापमंडल", "मध्यमंडल"], "a": 0, "c": "पृथ्वी की सतह से लगभग 8–18 km तक फैली क्षोभमंडल परत में जलवाष्प, बादल, वर्षा, आँधी आदि सभी मौसमी घटनाएँ होती हैं।", "e": ["सही – मौसम की अधिकांश घटनाएँ यहीं होती हैं।", "समतापमंडल में ओज़ोन परत है और मौसम की घटनाएँ बहुत कम होती हैं।", "तापमंडल में ऊँचाई पर तापमान बहुत बढ़ता है; यहाँ मौसम नहीं बनता।", "मध्यमंडल में उल्काएँ जलती हैं, मौसम नहीं बनता।"]}, {"n": 52, "s": "जीव विज्ञान", "q": "निम्नलिखित में से कौन-सा सर्वोत्‍तम रूप से यह वर्णन करता है, कि वृद्धि के कारण पादप कैसे गति प्रदर्शित करते हैं?", "o": ["स्पर्श करने पर मिमोसा की पत्ती का बंद होना", "जड़ों द्वारा मृदा से जल अवशोषित करना", "वीनस फ्लाईट्रैप की पत्ती का झटके से बंद होना", "तने का प्रकाश स्रोत की ओर झुकना"], "a": 3, "c": "वृद्धि के कारण होने वाली गति (जैसे प्रकाशानुवर्तन) में पादप का अंग कोशिका-वृद्धि की असमानता से मुड़ता है। तने का प्रकाश की ओर झुकना ऐसी ही गति है।", "e": ["मिमोसा की पत्ती का बंद होना वृद्धि से नहीं, कोशिकाओं के जल-दाब में बदलाव से होने वाली गति है।", "जल अवशोषण गति नहीं, एक शारीरिक क्रिया है।", "वीनस फ्लाईट्रैप का झटके से बंद होना भी वृद्धि-रहित त्वरित गति है।", "सही – असमान वृद्धि से तना प्रकाश की ओर मुड़ता है।"]}, {"n": 53, "s": "भौतिक विज्ञान", "q": "एक बड़ी चट्टान को न्यूनतम आयास के साथ ऊर्ध्वाधर रूप से ऊपर उठाने के लिए निम्नलिखित में से किस सरल मशीन का उपयोग किया जाना चाहिए, जबकि सभी सरल मशीनें आदर्श रूप से अभिकल्पित की गई हैं?", "o": ["दिशा बदलने के लिए एक एकल स्थिर घिरनी (fixed pulley)", "कई सपोर्टिंग स्ट्रैंड (supporting strands) वाला घिरनी निकाय", "अतिप्रवण कोण (steep angle) पर एक आनत समतल", "छोटी आयास भुजा (short effort arm) वाला उत्तोलक"], "a": 1, "c": "आदर्श मशीन में यांत्रिक लाभ जितना अधिक, उतना कम आयास लगता है। कई सहायक रस्सियों वाले घिरनी निकाय में भार कई रस्सियों में बँट जाता है, इसलिए आयास सबसे कम लगता है।", "e": ["एकल स्थिर घिरनी केवल बल की दिशा बदलती है, आयास कम नहीं करती।", "सही – अधिक स्ट्रैंड का मतलब अधिक यांत्रिक लाभ।", "खड़े (steep) आनत समतल पर यांत्रिक लाभ कम होता है; और ऊर्ध्वाधर उठाने के लिए यह उपयुक्त भी नहीं।", "छोटी आयास भुजा से उत्तोलक का यांत्रिक लाभ कम हो जाता है।"]}, {"n": 54, "s": "जीव विज्ञान", "q": "मस्तिष्क के किस भाग को क्षति पहुँचने पर श्वसन और हृद्-स्पंद में तत्काल व्यवधान होने की सर्वाधिक संभावना होती है?", "o": ["अनुमस्तिष्क (Cerebellum)", "प्रमस्तिष्क (Cerebrum)", "मैडुला ऑब्लांगेटा (Medulla oblongata)", "हाइपोथैलेमस (Hypothalamus)"], "a": 2, "c": "मैडुला ऑब्लांगेटा (मेडुला) श्वसन, हृदय-गति और रक्तचाप जैसी अनैच्छिक क्रियाओं का नियंत्रण करता है।", "e": ["अनुमस्तिष्क शरीर का संतुलन और गति-समन्वय करता है।", "प्रमस्तिष्क सोच, स्मृति और ऐच्छिक क्रियाएँ नियंत्रित करता है।", "सही – क्षति से श्वसन व हृदय-स्पंदन तुरंत बाधित होते हैं।", "हाइपोथैलेमस ताप, भूख-प्यास और हार्मोन का नियमन करता है।"]}, {"n": 55, "s": "भौतिक विज्ञान", "q": "निम्नलिखित में से कौन-सा कथन एकसमान वृत्तीय गति का उदाहरण नहीं है?", "o": ["पृथ्वी की परिक्रमा कर रहा एक कृत्रिम उपग्रह", "नियत चाल से घूम रहे सीलिंग फैन के ब्लेड", "पृथ्वी के चारों ओर चक्कर लगा रहा चंद्रमा", "सीधी सड़क पर लुढ़क रही एक गेंद"], "a": 3, "c": "एकसमान वृत्तीय गति में वस्तु वृत्ताकार पथ पर नियत चाल से चलती है। प्रश्न में वह उदाहरण पूछा है जो ऐसा नहीं है।", "e": ["उपग्रह की लगभग वृत्तीय कक्षा – उदाहरण है।", "पंखे का ब्लेड नियत चाल पर वृत्त में घूमता है – उदाहरण है।", "चंद्रमा की पृथ्वी के चारों ओर गति (लगभग वृत्तीय) – उदाहरण माना जाता है।", "सही – सीधी सड़क पर लुढ़कती गेंद का पथ सरल रेखा है, वृत्तीय नहीं।"]}, {"n": 56, "s": "रसायन विज्ञान", "q": "कौन-सा प्रतीक, ऑक्सीजन तत्व को निरूपित करता है?", "o": ["O", "C", "N", "S"], "a": 0, "c": "ऑक्सीजन का रासायनिक प्रतीक O है।", "e": ["सही – O ऑक्सीजन का प्रतीक है।", "C कार्बन का प्रतीक है।", "N नाइट्रोजन का प्रतीक है।", "S सल्फर (गंधक) का प्रतीक है।"]}, {"n": 57, "s": "भौतिक विज्ञान", "q": "निम्नलिखित में से कौन-सा परिदृश्‍य, एक व्यक्ति द्वारा सूटकेस पर ऋणात्मक कार्य किए जाने को दर्शाता है?", "o": ["एक व्यक्ति सूटकेस को ऊर्ध्वाधर ऊपर की ओर उठा रहा है", "एक व्यक्ति सूटकेस को छोड़ता है जिससे सूटकेस गुरुत्व के प्रभाव में स्वतंत्र रूप से नीचे गिरता है", "एक व्यक्ति सूटकेस को अपने सिर के ऊपर स्थिर अवस्था में पकड़े हुए है", "एक व्यक्ति सूटकेस को धीरे-धीरे भूमि पर नीचे ला रहा है"], "a": 3, "c": "कार्य W = F d cosθ। यदि बल और विस्थापन की दिशा विपरीत हो तो कार्य ऋणात्मक होता है। सूटकेस को धीरे-धीरे नीचे लाते समय हाथ का बल ऊपर और विस्थापन नीचे की ओर होता है।", "e": ["ऊपर उठाने में बल और विस्थापन एक ही दिशा में हैं – धनात्मक कार्य।", "छोड़ने पर व्यक्ति कोई बल नहीं लगाता; गुरुत्व बल और विस्थापन एक दिशा में, कार्य धनात्मक।", "स्थिर पकड़ने में विस्थापन शून्य है, इसलिए कार्य शून्य।", "सही – बल (ऊपर) और विस्थापन (नीचे) विपरीत हैं, इसलिए ऋणात्मक कार्य।"]}, {"n": 58, "s": "रसायन विज्ञान", "q": "अमोनियम सल्फेट के विलयन का pH लगभग 5 पाया जाता है। इस प्रेक्षण की व्याख्या कौन-सा कथन करता है?", "o": ["यह लवण, एक बफर के रूप में कार्य करता है, जो pH परिवर्तन का प्रतिरोध करता है।", "यह लवण एक प्रबल क्षार और एक प्रबल अम्ल से बना है, इसलिए यह उदासीन है।", "यह लवण एक दुर्बल क्षार और एक प्रबल अम्ल से बना है, जिसके कारण अम्लीय जल-अपघटन होता है।", "यह लवण एक दुर्बल अम्ल और एक प्रबल क्षार से बना है, जिसके कारण क्षारीय जल-अपघटन होता है।"], "a": 2, "c": "अमोनियम सल्फेट (NH₄)₂SO₄ दुर्बल क्षार NH₄OH और प्रबल अम्ल H₂SO₄ से बना है। इसका अम्लीय जल-अपघटन होता है, इसलिए pH लगभग 5 आता है।", "e": ["यह लवण बफर नहीं है; बफर दुर्बल अम्ल/क्षार और उसके लवण का मिश्रण होता है।", "यह प्रबल क्षार और प्रबल अम्ल से नहीं बना है; ऐसा लवण उदासीन (pH 7) होता।", "सही – दुर्बल क्षार + प्रबल अम्ल से अम्लीय जल-अपघटन।", "दुर्बल अम्ल + प्रबल क्षार का लवण क्षारीय होता है, pH 5 नहीं।"]}, {"n": 59, "s": "रसायन विज्ञान", "q": "'पदार्थ की अवस्थाओं का अंतःरूपांतरण' और 'ज्वलन' किसके उदाहरण हैं?", "o": ["क्रमशः भौतिक और रासायनिक परिवर्तन के", "दोनों रासायनिक परिवर्तन के", "दोनों भौतिक परिवर्तन के", "क्रमशः रासायनिक और भौतिक परिवर्तन के"], "a": 0, "c": "भौतिक परिवर्तन में केवल अवस्था/रूप बदलता है, नया पदार्थ नहीं बनता। रासायनिक परिवर्तन में नया पदार्थ बनता है। अवस्था-परिवर्तन भौतिक है और ज्वलन रासायनिक।", "e": ["सही – अवस्था-परिवर्तन भौतिक, ज्वलन रासायनिक।", "अवस्था-परिवर्तन रासायनिक नहीं है।", "ज्वलन भौतिक नहीं है; इसमें नए पदार्थ बनते हैं।", "क्रम उलटा है।"]}, {"n": 60, "s": "भौतिक विज्ञान", "q": "अनुरणन किसकी परिघटना है?", "o": ["ध्वनि का एक बार परावर्तन", "ध्वनि का अवशोषण", "बहु-परावर्तनों के कारण ध्वनि-निर्बंध", "ध्वनि तरंगों का अपवर्तन"], "a": 2, "c": "अनुरणन (reverberation) ध्वनि के बार-बार परावर्तन से बनी गूँज है, जो स्रोत बंद होने के बाद भी कुछ देर बनी रहती है (बड़े हॉल में)।", "e": ["एक बार का परावर्तन प्रतिध्वनि (echo) है।", "अवशोषण से ध्वनि घटती है; यह अनुरणन नहीं।", "सही – बहु-परावर्तनों से ध्वनि का निर्बंध (बनी रहना)।", "अपवर्तन में ध्वनि दिशा बदलती है; यह अनुरणन नहीं।"]}, {"n": 61, "s": "जीव विज्ञान", "q": "नाइट्रोजन चक्र के भाग के रूप में, मृदा में ऐज़ोटोबेक्टर (Azotobacter) जीवाणु कौन-सी प्रक्रिया करते हैं?", "o": ["अमोनिया का नाइट्राइट में रूपांतरण", "नाइट्रेट का नाइट्रोजन गैस में रूपांतरण", "नाइट्रोजन गैस का अमोनिया में रूपांतरण", "अमोनिया का प्रोटीन में रूपांतरण"], "a": 2, "c": "ऐज़ोटोबेक्टर मृदा के स्वतंत्र-जीवी जीवाणु हैं जो वायुमंडलीय नाइट्रोजन (N₂) को अमोनिया में बदलते हैं – इसे नाइट्रोजन स्थिरीकरण कहते हैं।", "e": ["अमोनिया से नाइट्राइट बनाना नाइट्रोसोमोनास का कार्य है।", "नाइट्रेट से N₂ बनाना विनाइट्रीकरण करने वाले जीवाणुओं का कार्य है।", "सही – N₂ का अमोनिया में रूपांतरण।", "अमोनिया से प्रोटीन पादप/जीव बनाते हैं, ऐज़ोटोबेक्टर का मुख्य कार्य यह नहीं।"]}, {"n": 62, "s": "रसायन विज्ञान", "q": "वह तत्व जिसे सामान्यतः \"जीवन का निर्माण खंड (building block of life)\" कहा जाता है, कौन-सा है?", "o": ["हीलियम", "आयरन", "सल्फर", "कार्बन"], "a": 3, "c": "कार्बन अपने परमाणुओं से लंबी श्रृंखलाएँ व वलय बनाकर प्रोटीन, कार्बोहाइड्रेट, वसा और DNA जैसे सभी जैव अणु बनाता है, इसलिए इसे जीवन का निर्माण खंड कहते हैं।", "e": ["हीलियम अक्रिय गैस है, जैव अणु नहीं बनाती।", "आयरन आवश्यक है पर निर्माण खंड नहीं; यह हीमोग्लोबिन में सूक्ष्म मात्रा में होता है।", "सल्फर कुछ प्रोटीनों में होता है पर मुख्य आधार नहीं।", "सही – कार्बन।"]}, {"n": 63, "s": "रसायन विज्ञान", "q": "यदि किसी परमाणु के नाभिक में एक न्यूट्रॉन जोड़ा जाता है, परंतु प्रोटॉन या इलेक्ट्रॉन नहीं जोड़ा जाता है, तो निम्नलिखित में से कौन-सा परिवर्तन होगा?", "o": ["इलेक्ट्रॉनों की संख्या बदल जाएगी, जिससे उसकी अभिक्रियाशीलता में परिवर्तन होगा।", "नाभिक का आवेश ऋणात्मक हो जाएगा।", "परमाणु संख्या बढ़ जाएगी, जिससे तत्व बदल जाएगा।", "द्रव्यमान संख्या बढ़ जाएगी, लेकिन तत्व के आवेश में कोई परिवर्तन नहीं होगा।"], "a": 3, "c": "नाभिक में न्यूट्रॉन जोड़ने पर प्रोटॉन-संख्या (परमाणु संख्या) नहीं बदलती, पर द्रव्यमान संख्या (प्रोटॉन + न्यूट्रॉन) बढ़ती है और समस्थानिक बनता है। तत्व और आवेश वही रहते हैं।", "e": ["इलेक्ट्रॉनों की संख्या नहीं बदलती।", "न्यूट्रॉन आवेशहीन है; नाभिक का आवेश धनात्मक ही रहता है।", "परमाणु संख्या नहीं बदलती, इसलिए तत्व नहीं बदलता।", "सही – द्रव्यमान संख्या बढ़ती है, तत्व और आवेश वही।"]}, {"n": 64, "s": "भौतिक विज्ञान", "q": "कार्य (W) और समय (t) दिए होने पर शक्ति (P) की गणना करने के लिए सही सूत्र निम्नलिखित में से कौन-सा है?", "o": ["P = W + t", "P = W/t", "P = W x t", "P = W - t"], "a": 1, "c": "शक्ति = कार्य ÷ समय, अर्थात् P = W/t। इसकी इकाई वाट (J/s) है।", "e": ["जोड़ने का सूत्र गलत है।", "सही – P = W/t।", "गुणा करने पर ऊर्जा×समय मिलता है, शक्ति नहीं।", "घटाने का सूत्र गलत है।"]}, {"n": 65, "s": "जीव विज्ञान", "q": "किसी पादप को कई दिनों तक सीलबंद कांच के डिब्बे में रखा जाता है। कौन-सी जैव प्रक्रिया सबसे अधिक प्रभावित होगी?", "o": ["जड़ों द्वारा जल अवशोषण", "परिवेश के साथ गैस का विनिमय", "भोजन का ऊर्जा में रूपांतरण", "पोषक तत्वों का परिवहन"], "a": 1, "c": "सीलबंद डिब्बे में हवा का आदान-प्रदान नहीं हो पाता: प्रकाश-संश्लेषण के लिए CO₂ और श्वसन के लिए O₂ चाहिए, जो सीमित हो जाती है, इसलिए गैस-विनिमय सबसे अधिक प्रभावित होता है।", "e": ["जड़ें मिट्टी से जल लेती रहती हैं; यह प्रमुख प्रभाव नहीं।", "भोजन का ऊर्जा में बदलना गैस-विनिमय बाधित होने का परिणाम है; सीधा प्रभाव गैस-विनिमय पर पड़ता है।", "सही – परिवेश से गैस का विनिमय सबसे अधिक प्रभावित होगा।", "परिवहन पादप के भीतर होता है; यह सीधा प्रभावित नहीं होता।"]}, {"n": 66, "s": "भौतिक विज्ञान", "q": "कोई छात्रा, जल से वायु में अभिलंब से किसी कोण पर एक लेजर किरणपुंज डालती है। वह देखती है कि वायु में प्रवेश करते ही किरणपुंज, अभिलंब से दूर हट जाती है। इस प्रेक्षण द्वारा अपवर्तन के नियमों की किस संकल्पना को सर्वोत्तम रूप से प्रदर्शित किया जा रहा है?", "o": ["विभिन्न माध्यमों में प्रकाश सदैव सीधे गमन करता है, जिसे अपवर्तन के नियमों द्वारा समझाया गया है।", "परावर्तन का नियम यह निर्धारित करता है कि लेजर किरणपुंज, अभिलंब से दूर हट जाती है।", "जब प्रकाश सघन माध्यम से विरल माध्यम में जाता है, तो यह अभिलंब से दूर हट जाता है।", "जब लेजर किरणपुंज वायु में प्रवेश करती है, तब पूर्ण आंतरिक परावर्तन इस व्यवहार की व्याख्या करता है।"], "a": 2, "c": "जब प्रकाश सघन माध्यम (जल) से विरल माध्यम (वायु) में जाता है, तो उसकी चाल बढ़ती है और वह अभिलंब से दूर मुड़ता है। यह अपवर्तन का नियम (स्नेल) है।", "e": ["माध्यम बदलने पर प्रकाश मुड़ता है; सीधे गमन का कथन ठीक नहीं।", "यह मुड़ाव अपवर्तन से है, परावर्तन से नहीं।", "सही – सघन से विरल में जाने पर किरण अभिलंब से दूर हटती है।", "पूर्ण आंतरिक परावर्तन में किरण वापस जल में लौटती है, वायु में नहीं जाती।"]}, {"n": 67, "s": "भौतिक विज्ञान", "q": "जब कोई पिंड एक सीधी रेखा में परिवर्ती चाल से गतिमान हो, तो हम उसकी गति की दर के परिमाण को किस प्रकार व्यक्त कर सकते हैं?", "o": ["कुल त्वरण", "नियत चाल", "औसत वेग", "विस्थापन"], "a": 2, "c": "सीधी रेखा में चलती वस्तु की परिवर्ती चाल को औसत चाल/औसत वेग (कुल दूरी या विस्थापन ÷ समय) से व्यक्त किया जाता है।", "e": ["कुल त्वरण वेग-परिवर्तन की दर है, गति की दर नहीं।", "नियत चाल का अर्थ है चाल बदलती नहीं – प्रश्न से मेल नहीं।", "सही – औसत वेग से गति की दर का परिमाण व्यक्त होता है।", "विस्थापन दूरी की सदिश माप है, दर नहीं।"]}, {"n": 68, "s": "रसायन विज्ञान", "q": "विभिन्न स्रोतों से प्राप्त जल के संघटन पर विचार करते समय, कौन-सा कथन स्थिर अनुपात के नियम को सर्वोत्तम रूप से स्‍पष्‍ट करता है?", "o": ["हाइड्रोजन और ऑक्सीजन किसी भी अनुपात में मिलकर जल का निर्माण करते हैं।", "किसी भी स्रोत से प्राप्त जल में हाइड्रोजन और ऑक्सीजन समान द्रव्यमान अनुपात में होते हैं।", "हाइड्रोजन और ऑक्सीजन केवल निश्चित ताप और दाब के अंतर्गत ही जल का निर्माण करते हैं।", "जल में हाइड्रोजन और ऑक्सीजन उसके स्रोत के आधार पर अलग-अलग अनुपात में होते हैं।"], "a": 1, "c": "स्थिर अनुपात का नियम (प्राउस्ट): किसी यौगिक में तत्व सदैव निश्चित द्रव्यमान अनुपात में होते हैं, चाहे स्रोत कोई भी हो। जल में H : O = 1 : 8।", "e": ["जल में तत्व किसी भी अनुपात में नहीं मिलते।", "सही – हर स्रोत के जल में H और O का द्रव्यमान अनुपात समान है।", "जल बनने का कारण ताप-दाब के अलावा निश्चित अनुपात है; यह कथन नियम नहीं बताता।", "स्रोत बदलने से अनुपात नहीं बदलता।"]}, {"n": 69, "s": "जीव विज्ञान", "q": "यदि दो जीवों के वंश समान हैं परंतु जातियां भिन्न हैं, तो इसका क्या अर्थ है?", "o": ["वे सभी विशेषताओं में समान हैं।", "वे अलग-अलग वंश के जीवों की तुलना में कम संबंधित हैं।", "वे निकटता से संबंधित हैं परंतु जातियों के स्तर पर भिन्न हैं।", "उनकी कोई उभयनिष्ठ विशेषता नहीं है।"], "a": 2, "c": "वर्गीकरण में जीवों के नाम में पहला भाग वंश (genus) और दूसरा जाति (species) होता है। समान वंश वाले जीव निकटता से संबंधित होते हैं, पर जाति अलग होती है।", "e": ["सभी लक्षण समान हों तो जाति भी समान होती।", "भिन्न वंश वालों की तुलना में वे अधिक निकट संबंधित हैं।", "सही – निकट संबंधी, पर जाति में अलग।", "समान वंश में अनेक उभयनिष्ठ लक्षण होते हैं।"]}, {"n": 70, "s": "भौतिक विज्ञान", "q": "यदि कोई व्यक्ति दीवार के निकट खड़ा होकर अपने हाथों से दीवार को धक्का देता है, तो दीवार द्वारा उस व्यक्ति पर लगाए गए बल के संबंध में निम्नलिखित में से कौन-सा कथन सही है?", "o": ["दीवार धक्का देने की दिशा में ही अधिक बल लगाती है", "दीवार व्यक्ति पर कोई बल नहीं लगाती है", "दीवार व्यक्ति पर बराबर एवं विपरीत बल लगाती है", "दीवार व्यक्ति को अपनी ओर खींचती है"], "a": 2, "c": "न्यूटन का तृतीय नियम: हर क्रिया के बराबर और विपरीत प्रतिक्रिया होती है। व्यक्ति दीवार को जितना धक्का देता है, दीवार उतना ही विपरीत बल उस पर लगाती है।", "e": ["दीवार का बल अधिक नहीं, बराबर होता है।", "दीवार बल लगाती है, इसलिए व्यक्ति पीछे धकेला जाता है।", "सही – बराबर एवं विपरीत बल।", "दीवार खींचती नहीं, धक्का देती है।"]}, {"n": 71, "s": "भौतिक विज्ञान", "q": "यदि कोई धावक 400 मीटर के वृत्ताकार ट्रैक को 80 सेकंड में पूरा करके प्रारंभिक बिंदु पर वापस आ जाता है, तो इस दौड़ के लिए औसत वेग का परिमाण क्या होगा?", "o": ["4 m/s", "5 m/s", "10 m/s", "0 m/s"], "a": 3, "c": "औसत वेग = कुल विस्थापन ÷ समय। वृत्ताकार ट्रैक पर प्रारंभिक बिंदु पर लौटने पर विस्थापन 0 होता है, इसलिए औसत वेग 0 है।", "e": ["4 m/s समय व किसी अन्य गणना की त्रुटि है।", "5 m/s औसत चाल (400/80) है, औसत वेग नहीं।", "10 m/s गलत गणना है।", "सही – विस्थापन शून्य, इसलिए औसत वेग 0 m/s।"]}, {"n": 72, "s": "रसायन विज्ञान", "q": "जब मैग्नीशियम वायु के साथ अभिक्रिया करता है, तो सामान्य प्रेक्षण क्‍या है?", "o": ["यह श्वेत पाउडर जैसी राख बनाता है", "यह लाल रंग के अवशेष बनाता है", "यह हरे रंग के क्रिस्टल बनाता है", "यह एक नीला विलयन बनाता है"], "a": 0, "c": "मैग्नीशियम वायु में चमकदार सफेद लौ से जलकर सफेद पाउडर (MgO राख) बनाता है: 2Mg + O₂ → 2MgO।", "e": ["सही – श्वेत पाउडर जैसी राख बनती है।", "लाल अवशेष मैग्नीशियम में नहीं बनता।", "हरे क्रिस्टल नहीं बनते।", "नीला विलयन नहीं बनता।"]}, {"n": 73, "s": "रसायन विज्ञान", "q": "एक खनन कंपनी किसी नई धातु की खोज करती है जो सक्रियता श्रेणी में निम्न है और अपनी प्राकृत अवस्था में पाई जाती है। शुद्ध धातु को कुशलतापूर्वक प्राप्त करने के लिए कंपनी को किस निष्कर्षण विधि को प्राथमिकता देनी चाहिए?", "o": ["वायु में भर्जन और उसके बाद अपचयन", "भौतिक पृथक्करण जैसे हाथ से चुनना या धावन", "अयस्क का तापीय अपघटन", "गलित धातु लवण का विद्युत अपघटन"], "a": 1, "c": "सक्रियता श्रेणी में निम्न (कम सक्रिय) धातुएँ, जैसे सोना, प्लैटिनम, प्रकृति में मुक्त अवस्था में मिलती हैं। इन्हें भौतिक विधियों (चुनना, धावन) से अलग किया जा सकता है।", "e": ["भर्जन और अपचयन सल्फाइड/ऑक्साइड अयस्कों के लिए है।", "सही – मुक्त धातु के लिए भौतिक पृथक्करण पर्याप्त है।", "तापीय अपघटन सामान्यतः मुक्त धातु के लिए आवश्यक नहीं।", "विद्युत अपघटन अति सक्रिय धातुओं (Na, Al) के लिए है।"]}, {"n": 74, "s": "जीव विज्ञान", "q": "स्त्रियों में आर्तव चक्र की शुरुआत निम्नलिखित में से किस घटना से होती है?", "o": ["निषेचित अंडे का रोपण", "परिपक्व अंडे का अंडोत्सर्ग", "शुक्राणु कोशिका द्वारा अंडाणु का निषेचन", "गर्भाशय अस्तर का टूटकर बाहर निकलना"], "a": 3, "c": "आर्तव (मासिक) चक्र की शुरुआत उस दिन से मानी जाती है जब गर्भाशय का अस्तर टूटकर रक्तस्राव के रूप में बाहर निकलता है (माहवारी)।", "e": ["रोपण गर्भधारण में होता है, चक्र की शुरुआत नहीं।", "अंडोत्सर्ग चक्र के बीच में होता है।", "निषेचन चक्र की शुरुआत नहीं करता।", "सही – गर्भाशय अस्तर का निष्कासन चक्र का पहला दिन है।"]}, {"n": 75, "s": "रसायन विज्ञान", "q": "निम्नलिखित में से कौन-सा, विषमांगी मिश्रण का सर्वोत्तम वर्णन करता है?", "o": ["एक ऐसा पदार्थ जिसमें केवल एक प्रकार के कण होते हैं", "एक ऐसा मिश्रण जिसमें सभी घटक सर्वत्र एकसमान रूप से मिश्रित होते हैं", "एक ऐसा मिश्रण जिसके घटक एकसमान रूप से वितरित नहीं होते हैं", "समरूप गुणधर्मों वाली गैसों का मिश्रण"], "a": 2, "c": "विषमांगी मिश्रण में घटक एकसमान रूप से वितरित नहीं होते और अलग-अलग दिखाई देते हैं (जैसे रेत-नमक)।", "e": ["केवल एक प्रकार के कण वाला शुद्ध पदार्थ होता है।", "सर्वत्र एकसमान मिश्रण समांगी मिश्रण होता है।", "सही – घटक एकसमान वितरित नहीं होते।", "गैसों का समरूप मिश्रण समांगी होता है।"]}, {"n": 76, "s": "रसायन विज्ञान", "q": "ग्रेफाइट की तुलना में, हीरे की कठोरता अत्‍यंत उच्‍च क्यों होती है?", "o": ["हीरे में प्रबल आबंधों वाला त्रि-विमीय जालक्रम होता है", "ग्रेफाइट, परमाणुओं की नम्‍य श्रृंखलाओं से बना होता है", "ग्रेफाइट में परमाणुओं के बीच धात्विक आबंधन होता है", "हीरे में परमाणु परतों में शिथिल रूप से संवेष्टित होते हैं"], "a": 0, "c": "हीरे में प्रत्येक कार्बन परमाणु चार अन्य कार्बन से प्रबल सहसंयोजक आबंधों द्वारा त्रि-विमीय जालक बनाता है, इसलिए यह अत्यंत कठोर है। ग्रेफाइट में परतें हैं जो आपस में फिसलती हैं।", "e": ["सही – प्रबल आबंधों वाला त्रि-विमीय जालक्रम।", "कथन ग्रेफाइट की संरचना को पूरा नहीं बताता और कठोरता का कारण हीरे का जालक है।", "ग्रेफाइट में सहसंयोजक आबंध होते हैं, धात्विक नहीं।", "हीरे में परमाणु परतों में शिथिल नहीं, प्रबलता से बँधे हैं; यह वर्णन ग्रेफाइट का है।"]}, {"n": 77, "s": "जीव विज्ञान", "q": "पेशी-कंकाल तंत्र में गति के लिए मुख्य रूप से किस प्रकार का ऊतक उत्तरदायी होता है?", "o": ["तंत्रिका ऊतक", "पेशीय ऊतक", "उपकला ऊतक", "संयोजी function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function oh(q,i){return q.h?q.o[i]:esc(q.o[i])}
function newTest(){st={phase:'run',end:Date.now()+TOTAL*1000,ans:{},vis:{0:1},cur:0};save();run()}
function remain(){return Math.max(0,Math.ceil((st.end-Date.now())/1000))}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><h2>निर्देश</h2><ul><li>कुल प्रश्न: ${N} (भौतिक, रसायन और जीव विज्ञान) – RRB Technician Gr-III, 8 अक्टूबर 2026, Second Shift (12:45 PM)।</li><li>समय: ठीक 20 मिनट। समय समाप्त होते ही टेस्ट अपने-आप जमा हो जाएगा।</li><li>अंकन: सही उत्तर पर +1, गलत उत्तर पर −1/3 (मूल PDF में दिया गया नियम)। उत्तर न देने पर 0।</li><li>पेज Refresh करने पर बचा हुआ समय और आपके उत्तर सुरक्षित रहेंगे।</li><li>उत्तर कुंजी और व्याख्या टेस्ट जमा करने के बाद ही दिखेगी।</li></ul><button class="p" onclick="newTest()">टेस्ट शुरू करें</button></div>`;tm.classList.add('hide')}
function run(){tm.classList.remove('hide');draw();clearInterval(tick);tick=setInterval(tk,250);tk()}
function tk(){const r=remain();tm.textContent=fmt(r);tm.classList.toggle('warn',r<=WARN);if(r<=0){clearInterval(tick);submit(true)}}
function stat(){let a=Object.keys(st.ans).length;return[a,N-a]}
function draw(){const q=Q[st.cur],[a,u]=stat(),i=st.cur;st.vis[i]=1;save();
 let pal='';Q.forEach((x,j)=>{const c=(st.ans[j]!==undefined?'a':st.vis[j]?'v':'')+(j===i?' c':'');pal+=`<button class="${c}" onclick="go(${j})">${j+1}</button>`});
 app.innerHTML=`<div class="grid"><div class="card"><div><b>प्रश्न ${i+1} / ${N}</b><span class="tag">${q.s}</span></div><p style="font-size:1.08rem">${esc(q.q)}</p><div>${q.o.map((_,k)=>`<button class="opt ${st.ans[i]===k?'sel':''}" onclick="pick(${k})"><b>${L[k]}.</b> ${oh(q,k)}</button>`).join('')}</div><div class="bar"><button onclick="go(${i-1})" ${i?'':'disabled'}>← Previous</button><button onclick="go(${i+1})" ${i<N-1?'':'disabled'}>Next →</button><button onclick="clr()">Clear Response</button><span class="sp"></span><button class="d" onclick="ask()">Submit Test</button></div></div>
 <div class="card"><div class="st"><div><b style="color:var(--ok)">${a}</b>Attempted</div><div><b style="color:var(--no)">${u}</b>Unattempted</div></div><div class="pal">${pal}</div><div class="lg"><i style="background:var(--ok)"></i>उत्तर दिया<i style="background:#f6c9c5"></i>देखा, उत्तर नहीं<i style="background:var(--gr)"></i>नहीं देखा</div></div></div>`}
function go(j){if(j<0||j>=N)return;st.cur=j;draw()}
function pick(k){st.ans[st.cur]=k;draw()}
function clr(){delete st.ans[st.cur];draw()}
function ask(){const [a,u]=stat(),m=document.createElement('div');m.className='modal';m.id='mod';m.innerHTML=`<div class="card"><h3>टेस्ट जमा करें?</h3><p>Attempted: ${a} | Unattempted: ${u}<br>जमा करने के बाद उत्तर बदले नहीं जा सकेंगे।</p><div class="bar"><button onclick="$('mod').remove()">वापस जाएँ</button><span class="sp"></span><button class="d" onclick="submit(false)">हाँ, जमा करें</button></div></div>`;document.body.appendChild(m)}
function calc(ans){let c=0,w=0,s=0;Q.forEach((q,i)=>{if(ans[i]===undefined)s++;else if(ans[i]===q.a)c++;else w++});
 const sc=Math.round((c-w/3)*100)/100,att=c+w;return{c,w,s,sc,acc:att?Math.round(c/att*1000)/10:0}}
function submit(auto){clearInterval(tick);const m=$('mod');if(m)m.remove();st.phase='done';st.auto=!!auto;save();result()}
let flt='all';
function result(){tm.classList.add('hide');const r=calc(st.ans);
 const sub={};Q.forEach((q,i)=>{const o=sub[q.s]||(sub[q.s]={t:0,c:0,w:0});o.t++;if(st.ans[i]!==undefined){st.ans[i]===q.a?o.c++:o.w++}});
 let rev='';Q.forEach((q,i)=>{const u=st.ans[i],stt=u===undefined?'s':u===q.a?'c':'w';if(flt!=='all'&&flt!==stt)return;
  rev+=`<div class="card"><b>प्रश्न ${i+1}</b><span class="tag">${q.s}</span> <span class="${stt=='c'?'ok-t':stt=='w'?'no-t':'sk-t'}">${stt=='c'?'सही':stt=='w'?'गलत':'छोड़ा गया'}</span><p>${esc(q.q)}</p>${q.o.map((_,k)=>`<div class="ro ${k===q.a?'ok':u===k?'bad':''}"><b>${L[k]}.</b> ${oh(q,k)} ${k===q.a?'✔ सही उत्तर':''}${u===k&&k!==q.a?'✘ आपका उत्तर':''}${u===k&&k===q.a?' (आपका उत्तर)':''}<small>${esc(q.e[k])}</small></div>`).join('')}<div class="cpt"><b>अवधारणा:</b> ${esc(q.c)}</div></div>`});
 app.innerHTML=`<div class="card"><h2>परिणाम ${st.auto?'(समय समाप्त – Auto-Submit)':''}</h2><div class="stats"><div><b>${r.sc}/${N}</b>कुल स्कोर</div><div><b class="ok-t">${r.c}</b>सही</div><div><b class="no-t">${r.w}</b>गलत</div><div><b>${r.s}</b>छोड़े गए</div><div><b>${r.acc}%</b>Accuracy</div></div><p style="color:var(--mu)">स्कोर = सही − (गलत ÷ 3)। Accuracy = सही ÷ किए गए प्रश्न × 100।</p>
 <table><tr><th>विषय</th><th>प्रश्न</th><th>सही</th><th>गलत</th></tr>${Object.keys(sub).map(k=>`<tr><td>${k}</td><td>${sub[k].t}</td><td>${sub[k].c}</td><td>${sub[k].w}</td></tr>`).join('')}</table>
 <div class="bar"><button class="p" onclick="newTest()">Retake (नया 20:00 Timer)</button><span class="sp"></span>${[['all','सभी'],['w','गलत'],['s','छोड़े गए'],['c','सही']].map(f=>`<button ${flt===f[0]?'class="p"':''} onclick="flt='${f[0]}';result()">${f[1]}</button>`).join('')}</div></div>${rev}`}
if(!st)start();else if(st.phase==='done')result();else if(remain()<=0)submit(true);else run();
</script>
</body>
</html>
