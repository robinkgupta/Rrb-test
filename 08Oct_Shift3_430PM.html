<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#5b6578;--br:#d5dbe8;--pr:#1f4fd8;--ok:#1a8f4c;--no:#d1382f;--wa:#e8a100;--gr:#c9cfdc}
@media(prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1a2030;--tx:#e7ebf4;--mu:#9aa5bb;--br:#2e374c;--pr:#6c93ff;--ok:#3fc27a;--no:#ff6b61;--wa:#ffc23d;--gr:#3a435a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Devanagari","Mangal","Nirmala UI",system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--br);padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:1rem;margin:0}.wrap{max-width:1050px;margin:0 auto;padding:14px}
#timer{font:700 1.3rem/1 ui-monospace,Consolas,monospace;padding:7px 12px;border-radius:8px;border:2px solid var(--br)}
#timer.warn{color:#fff;background:var(--no);border-color:var(--no);animation:bl 1s infinite}@keyframes bl{50%{opacity:.55}}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 290px;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--br);background:var(--card);color:var(--tx);padding:9px 14px}

.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 12px;border-width:2px}.opt.sel{border-color:var(--pr);background:rgba(31,79,216,.12)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar .sp{flex:1}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.pal button{padding:7px 0;font-weight:700;background:var(--gr);border-color:var(--gr)}
.pal .v{background:#f6c9c5;border-color:#f6c9c5;color:#7a1a14}.pal .a{background:var(--ok);border-color:var(--ok);color:#fff}.pal .c{outline:3px solid var(--pr);outline-offset:1px}
.lg{font-size:.85rem;color:var(--mu);margin-top:10px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 8px;vertical-align:middle}
.st{display:flex;gap:8px;margin-bottom:10px}.st div{flex:1;text-align:center;border:1px solid var(--br);border-radius:8px;padding:6px}.st b{display:block;font-size:1.2rem}
.tag{font-size:.78rem;background:var(--br);border-radius:99px;padding:2px 9px;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stats div{text-align:center;border:1px solid var(--br);border-radius:10px;padding:10px}.stats b{display:block;font-size:1.5rem}
.ro{margin:7px 0;padding:9px 11px;border-radius:8px;border:1px solid var(--br)}.ro.ok{border-color:var(--ok);background:rgba(26,143,76,.13)}.ro.bad{border-color:var(--no);background:rgba(209,56,47,.12)}
.ro small{display:block;color:var(--mu)}.cpt{background:rgba(232,161,0,.15);border-left:4px solid var(--wa);padding:8px 12px;border-radius:6px;margin:8px 0}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--br);padding:6px;text-align:center}
.ok-t{color:var(--ok);font-weight:700}.no-t{color:var(--no);font-weight:700}.sk-t{color:var(--mu);font-weight:700}
.hide{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.modal .card{max-width:420px;margin:0}

<header><h1>RRB Technician Science Quiz – 8 October, Third Shift</h1><div id="timer" class="hide">20:00</div></header>

<script>
const Q=[{"n": 51, "s": "भौतिक विज्ञान", "q": "यदि आप किसी खेल के मैदान में अपने उस मित्र को पुकारते हैं जो आपसे समान दूरी पर है और इस्पात की पटरी के दूसरे छोर को स्पर्श भी कर रहा है, तो आपका मित्र आपकी ध्वनि किस माध्यम से पहले सुनेगा, और क्यों?", "o": ["खेल के मैदान में, क्योंकि ध्वनि ठोस पदार्थों की तुलना में वायु में अधिक सुगमता से गमन करती है।", "खेल के मैदान में क्योंकि ध्वनि इस्पात के माध्यम से दक्षतापूर्वक गमन नहीं करती।", "इस्पात की पटरी के माध्यम से, क्योंकि ध्वनि वायु की अपेक्षा ठोस माध्यमों में बहुत तीव्र गमन करती है।", "इस्पात की पटरी के माध्यम से, क्योंकि वायु की तुलना में ठोस पदार्थ प्रत्येक ध्वनि को अधिक प्रबल कर देते हैं।"], "a": 2, "c": "ध्वनि की चाल ठोस में सबसे अधिक, द्रव में कम और गैस (वायु) में सबसे कम होती है। इस्पात में ध्वनि लगभग 5000 m/s से चलती है, वायु में लगभग 340 m/s से।", "e": ["वायु में ध्वनि ठोस की तुलना में धीमी चलती है।", "इस्पात ध्वनि को बहुत अच्छी तरह संचारित करता है।", "सही – ठोस माध्यम में ध्वनि तीव्र गमन करती है, इसलिए पहले पटरी से सुनाई देगी।", "कारण 'ठोस ध्वनि को प्रबल करता है' नहीं, चाल अधिक होना है।"]}, {"n": 52, "s": "भौतिक विज्ञान", "q": "एक विद्यार्थी किसी गेंद की गति को दर्ज करता है जो बिंदु Q से बिंदु R तक जाती है, फिर बिंदु S पर वापस लौटती है, और यह सब एक ही सरल रेखा के अनुदिश होता है। यदि गेंद Q से R तक जाने में 70 मीटर की दूरी तय करती है, और फिर R से S तक जाने में 30 मीटर की दूरी तय करती है, तो कौन-सा, इस यात्रा के लिए कुल पथ-लम्बाई और विस्थापन के बीच के भौतिक अंतर को सर्वोत्तम रूप से निरूपित करता है?", "o": ["विस्थापन सदैव पथ-लम्बाई से अधिक होता है क्योंकि यह सबसे छोटे मार्ग को मापता है।", "चूँकि गति एक सरल रेखा के अनुदिश है, इसलिए पथ-लम्बाई और विस्थापन बराबर होंगे।", "पथ-लम्बाई तय की गई कुल दूरी होती है, जबकि विस्थापन Q से S तक नेट सरल रेखीय दूरी है।", "पथ-लम्बाई केवल अंतिम स्थिति पर निर्भर करती है, जबकि विस्थापन संपूर्ण यात्रा पर निर्भर करता है।"], "a": 2, "c": "पथ-लंबाई कुल तय की गई दूरी है (70 + 30 = 100 m)। विस्थापन आरंभिक व अंतिम बिंदु के बीच सरल रेखीय दूरी है (Q से S तक 40 m)।", "e": ["विस्थापन कभी पथ-लंबाई से अधिक नहीं होता।", "सरल रेखा में भी लौटने पर दोनों भिन्न हो जाते हैं (100 m बनाम 40 m)।", "सही – पथ-लंबाई कुल दूरी है, विस्थापन Q से S तक नेट दूरी।", "उल्टा लिखा है: विस्थापन केवल आरंभ-अंत पर निर्भर है, पथ-लंबाई पूरे मार्ग पर।"]}, {"n": 53, "s": "जीव विज्ञान", "q": "निम्नलिखित में से कौन-सा, भारतीय हिमालय क्षेत्र में पाई जाने वाली समृद्ध जैव-विविधता का प्रमुख कारण है?", "o": ["तुंगता और जलवायु में विविधता", "सक्रिय वनस्पति और खेती", "देश भर में मृदा उर्वरता की एकरूपता", "वर्षा का समान वितरण"], "a": 0, "c": "हिमालय में ऊँचाई (तुंगता) बढ़ने से तापमान, वर्षा व मृदा बदलती है, इसलिए अनेक जलवायु-क्षेत्र बनते हैं और जैव-विविधता समृद्ध होती है।", "e": ["सही – तुंगता और जलवायु की विविधता मुख्य कारण है।", "सक्रिय वनस्पति और खेती जैव-विविधता का मुख्य कारण नहीं है।", "मृदा की एकरूपता विविधता घटाती है, बढ़ाती नहीं।", "वर्षा हिमालय में समान नहीं, क्षेत्र-अनुसार बदलती है।"]}, {"n": 54, "s": "रसायन विज्ञान", "q": "सक्रियता श्रेणी में धातुओं को उनकी अभिक्रियाशीलता के घटते क्रम में व्यवस्थित किया जाता है। वह धातु कौन-सी है, जो सक्रियता श्रेणी के शीर्ष पर स्थित होती है?", "o": ["पोटैशियम", "ऐल्यूमीनियम", "सोडियम", "मैग्नीशियम"], "a": 0, "c": "सक्रियता श्रेणी में सबसे ऊपर सबसे अधिक अभिक्रियाशील धातु होती है। दिए गए विकल्पों में क्रम: पोटैशियम > सोडियम > मैग्नीशियम > ऐल्यूमीनियम।", "e": ["सही – पोटैशियम सबसे अधिक अभिक्रियाशील है।", "ऐल्यूमीनियम इन चारों में सबसे कम अभिक्रियाशील है।", "सोडियम पोटैशियम से कम अभिक्रियाशील है।", "मैग्नीशियम पोटैशियम और सोडियम से कम अभिक्रियाशील है।"]}, {"n": 55, "s": "रसायन विज्ञान", "q": "एक विद्यार्थी अपघटन अभिक्रिया का प्रेक्षण कर रहा है जिसमें हल्के पीले रंग का चूर्ण गर्म करने पर लाल-भूरे रंग के ठोस और रंगहीन गैस में परिवर्तित हो जाता है। इसमें किस यौगिक का उपयोग किया गया था?", "o": ["पोटैशियम परमैंगनेट", "लेड नाइट्रेट", "सिल्वर ब्रोमाइड", "ज़िंक कार्बोनेट"], "a": 1, "c": "मूल कुंजी का उत्तर लेड नाइट्रेट है। गर्म करने पर यह PbO (पीला/लाल-भूरा ठोस), NO₂ और O₂ में अपघटित होता है। प्रश्न का रंग-वर्णन पूरी तरह स्पष्ट नहीं है, पर परीक्षा में कुंजी का उत्तर मान्य है।", "e": ["KMnO₄ गर्म करने पर K₂MnO₄, MnO₂ और O₂ देता है; चूर्ण बैंगनी होता है।", "सही (कुंजी अनुसार) – लेड नाइट्रेट का तापीय अपघटन।", "AgBr प्रकाश से चाँदी और ब्रोमीन देता है; गर्म करने की यह प्रसिद्ध अभिक्रिया नहीं।", "ZnCO₃ गर्म करने पर ZnO और CO₂ देता है; ठोस सफेद/पीला होता है।"]}, {"n": 56, "s": "भौतिक विज्ञान", "q": "r त्रिज्या की एक वृत्ताकार कुंडली में I धारा प्रवाहित होती है। यदि कुंडली के फेरों की संख्या दोगुनी कर दी जाए (त्रिज्या और धारा को अपरिवर्तित रखते हुए), तो उसके केंद्र पर चुंबकीय क्षेत्र ________।", "o": ["अपरावर्तित रहेगा", "चार गुना हो जाएगा", "दोगुना हो जाएगा", "घटकर आधा हो जाएगा"], "a": 2, "c": "वृत्ताकार कुंडली के केंद्र पर चुंबकीय क्षेत्र B = μ₀NI/2r। फेरे N दोगुने करने पर B भी दोगुना हो जाता है।", "e": ["N बदलने से B अवश्य बदलता है।", "B, N के अनुक्रमानुपाती है, N² के नहीं; चार गुना नहीं होगा।", "सही – B ∝ N, इसलिए दोगुना।", "फेरे बढ़ाने से क्षेत्र घटता नहीं, बढ़ता है।"]}, {"n": 57, "s": "रसायन विज्ञान", "q": "संतृप्त हाइड्रोकार्बन सामान्य परिस्थितियों में सामान्यतः अक्रियाशील क्यों होते हैं?", "o": ["वे सामान्य (कमरे के) तापमान पर ऑक्सीजन के साथ स्वतः अभिक्रिया करते हैं।", "उनमें दुर्बल पाई (π) आबंध होते हैं जो सरलता से विखंडित हो जाते हैं।", "उनमें प्रबल सिग्मा (σ) आबंध होते हैं जिनके विखंडन के लिए उच्च ऊर्जा की आवश्यकता होती है।", "वे अत्यधिक ध्रुवीय होते हैं और जल में विलयित होकर अभिक्रियाओं को अवरुद्ध करते हैं।"], "a": 2, "c": "संतृप्त हाइड्रोकार्बन में केवल प्रबल सिग्मा (σ) आबंध (C–C, C–H) होते हैं। इन्हें तोड़ने के लिए बहुत ऊर्जा चाहिए, इसलिए ये सामान्य स्थिति में कम अभिक्रियाशील हैं।", "e": ["ये कमरे के तापमान पर ऑक्सीजन से स्वतः अभिक्रिया नहीं करते।", "संतृप्त यौगिकों में π आबंध होते ही नहीं।", "सही – प्रबल σ आबंध टूटने में उच्च ऊर्जा चाहिए।", "ये ध्रुवीय नहीं, लगभग अध्रुवीय हैं और जल में अविलेय हैं।"]}, {"n": 58, "s": "जीव विज्ञान", "q": "सजीवों के वर्गीकरण की वैज्ञानिक पद्धति अपनाने का कारण निम्नलिखित में से कौन-सा है?", "o": ["जीवों की जीवन-अवधि को मापना", "फसल उत्पादन में सुधार करना", "जीवों में प्रजनन को बढ़ाना", "जीवों के नामकरण और समूहन में संभ्रम से बचना"], "a": 3, "c": "वर्गीकरण से जीवों का नामकरण और समूहन व्यवस्थित होता है और अलग-अलग नामों से होने वाला भ्रम दूर होता है (द्विनाम पद्धति)।", "e": ["वर्गीकरण का उद्देश्य जीवन-अवधि मापना नहीं है।", "इसका उद्देश्य फसल उत्पादन बढ़ाना नहीं है।", "इसका उद्देश्य प्रजनन बढ़ाना नहीं है।", "सही – नामकरण और समूहन में भ्रम से बचाव।"]}, {"n": 59, "s": "भौतिक विज्ञान", "q": "निम्नलिखित में से किस स्थिति में एक अपरिवर्ती बल द्वारा किया गया कार्य शून्य होता है?", "o": ["जब बल, गति की दिशा के समांतर कार्यरत हो", "जब बल, गति की दिशा के लंबवत कार्यरत हो", "जब बल, विस्थापन की दिशा के विपरीत कार्यरत हो", "जब बल, गति की दिशा से एक न्यून कोण पर कार्यरत हो"], "a": 1, "c": "कार्य W = F d cosθ। बल गति की दिशा के लंबवत हो तो θ = 90°, cos90° = 0, इसलिए कार्य शून्य होता है।", "e": ["समांतर बल पर θ = 0°, कार्य अधिकतम धनात्मक।", "सही – लंबवत बल पर कार्य शून्य।", "विपरीत दिशा में कार्य ऋणात्मक होता है, शून्य नहीं।", "न्यून कोण पर cosθ धनात्मक है, कार्य शून्य नहीं।"]}, {"n": 60, "s": "जीव विज्ञान", "q": "कौन-सा विभज्योतक, कुछ पादपों के आधार पर स्थित होता है और कटाई के बाद उनके पुनरुद्भवन में सहायता करता है?", "o": ["अंतर्वेशी विभज्योतक (Intercalary Meristem)", "शीर्षस्थ विभज्योतक (Apical Meristem)", "परिधि विभज्योतक (Girth Meristem)", "पार्श्विक विभज्योतक (Lateral Meristem)"], "a": 0, "c": "अंतर्वेशी विभज्योतक पर्व (गाँठ) के आधार पर स्थित होता है। घास आदि में कटने या चरे जाने के बाद यही पुनः वृद्धि कराता है।", "e": ["सही – अंतर्वेशी विभज्योतक पुनरुद्भवन में सहायक है।", "शीर्षस्थ विभज्योतक तने/जड़ के सिरे पर लंबाई बढ़ाता है।", "'परिधि विभज्योतक' मान्य नाम नहीं है; मोटाई पार्श्विक विभज्योतक बढ़ाता है।", "पार्श्विक विभज्योतक तने की मोटाई (चौड़ाई) बढ़ाता है।"]}, {"n": 61, "s": "रसायन विज्ञान", "q": "निम्नलिखित में से कौन-सा एक शाखित एल्केन नहीं है?", "o": ["आइसोपेंटेन (Isopentane)", "N-पेंटेन (N-pentane)", "नियोपेंटेन (Neopentane)", "आइसोब्यूटेन (Isobutane)"], "a": 1, "c": "शाखित एल्केन में मुख्य श्रृंखला से शाखाएँ जुड़ी होती हैं। N-पेंटेन सीधी श्रृंखला वाला है, इसल  3 है, क्योंकि यह स्थायी विन्यास प्राप्त करने के लिए तीन इलेक्ट्रॉन ग्रहण करता है।", "फॉस्फोरस की संयोजकता 3 है, क्योंकि यह स्थायित्व प्राप्त करने के लिए तीन इलेक्ट्रॉनों का त्याग करता है।", "फॉस्फोरस की संयोजकता 5 है, क्योंकि यह पांच इलेक्ट्रॉनों का त्याग करता है।"], "a": 1, "c": "फॉस्फोरस (2, 8, 5) में 5 संयोजी इलेक्ट्रॉन हैं। अष्टक पूरा करने के लिए 3 इलेक्ट्रॉन ग्रहण करना आसान है, इसलिए संयोजकता 3 मानी जाती है (8 − 5)।", "e": ["संयोजकता 5 बताकर इसे संयोजी इलेक्ट्रॉनों की संख्या के बराबर कहना यहाँ स्थायित्व की सही व्याख्या नहीं।", "सही – 3 इलेक्ट्रॉन ग्रहण कर अष्टक पूरा, संयोजकता 3।", "3 इलेक्ट्रॉन त्यागना ऊर्जात्मक रूप से कठिन है; यह ग्रहण करता है।", "5 इलेक्ट्रॉन त्यागना सामान्य रास्ता नहीं।"]}, {"n": 77, "s": "रसायन विज्ञान", "q": "परमाणु की द्रव्यमान संख्या की गणना में इलेक्ट्रॉनों को शामिल क्यों नहीं किया जाता है?", "o": ["इलेक्ट्रॉन केवल परमाणु के आवेश को निर्धारित करते हैं", "इलेक्ट्रॉनों की संख्या प्रोटॉनों और न्यूट्रॉनों से अधिक होती है", "प्रोटॉनों और न्यूट्रॉनों की तुलना में इलेक्ट्रॉनों का द्रव्यमान नगण्य होता है", "इलेक्ट्रॉन, प्रोटॉन और न्यूट्रॉन से भारी होते हैं"], "a": 2, "c": "द्रव्यमान संख्या = प्रोटॉन + न्यूट्रॉन। इलेक्ट्रॉन का द्रव्यमान प्रोटॉन का लगभग 1/1836 है, इसलिए नगण्य है।", "e": ["इलेक्ट्रॉन आवेश के अलावा द्रव्यमान भी रखते हैं, पर यह कारण नहीं।", "इलेक्ट्रॉन की संख्या प्रोटॉन से अधिक नहीं, उदासीन परमाणु में बराबर होती है।", "सही – इलेक्ट्रॉन का द्रव्यमान नगण्य है।", "इलेक्ट्रॉन प्रोटॉन-न्यूट्रॉन से बहुत हल्के हैं।"]}, {"n": 78, "s": "भौतिक विज्ञान", "q": "जब श्वेत प्रकाश किसी प्रिज्म के माध्यम से गुजरता है, तो वह एक स्पेक्ट्रम उत्पन्न करता है। यदि लाल प्रकाश का अपवर्तनांक 1.50 है, और बैंगनी प्रकाश का अपवर्तनांक 1.54 है, तो यह प्रिज्म में विभिन्न रंगों के व्यवहार के संबंध में क्या बताता है?", "o": ["बैंगनी प्रकाश, लाल प्रकाश की तुलना में अधिक मुड़ ता है", "लाल प्रकाश, बैंगनी प्रकाश की तुलना में अधिक मुड़ ता है", "दोनों रंग बिना मुड़े गमन करते हैं", "दोनों रंग समान रूप से मुड़ ते हैं"], "a": 0, "c": "प्रिज्म में जिस रंग का अपवर्तनांक अधिक होता है वह अधिक मुड़ता है। बैंगनी (1.54) > लाल (1.50), इसलिए बैंगनी अधिक मुड़ता है।", "e": ["सही – अधिक अपवर्तनांक वाला बैंगनी अधिक मुड़ता है।", "लाल कम मुड़ता है।", "प्रिज्म में दोनों मुड़ते हैं (विचलन होता है)।", "दोनों समान नहीं मुड़ते; इसी से स्पेक्ट्रम बनता है।"]}, {"n": 79, "s": "भौतिक विज्ञान", "q": "एक साइकिल चालक, अपनी यात्रा के पहले 6 किलोमीटर 20 मिनट में और अगले 9 किलोमीटर 30 मिनट में तय करता है। पूरी यात्रा के लिए किलोमीटर प्रति घंटा (km/h) में उसकी औसत चाल ज्ञात कीजिए।", "o": ["18 km/h", "20 km/h", "12 km/h", "15 km/h"], "a": 0, "c": "औसत चाल = कुल दूरी/कुल समय = (6 + 9) km / (50 मिनट = 5/6 h) = 15 × 6/5 = 18 km/h।", "e": ["सही – 18 km/h।", "20 km/h गलत गणना है।", "12 km/h गलत गणना है।", "15 km/h केवल दूरी का योग है, समय (घंटे) से भाग नहीं दिया।"]}, {"n": 80, "s": "भौतिक विज्ञान", "q": "कोई व्यक्ति एक भारी बैग को समतल फर्श पर एकसमान चाल से क्षैतिज रूप से ले जाता है। गति की दिशा में व्यक्ति द्वारा बैग पर प्रयुक्त बल द्वारा किया गया कार्य कितना है?", "o": ["किया गया कार्य ऋणात्मक है क्योंकि बैग भारी है", "किया गया कार्य ऋणात्मक है क्योंकि बल, गति का विरोध करता है", "किया गया कार्य धनात्मक है क्योंकि व्यक्ति, बैग को आगे ले जाता है", "किया गया कार्य शून्य है क्योंकि बल, विस्थापन के लंबवत है"], "a": 3, "c": "बैग पर लगाया गया बल ऊपर की ओर (भार के बराबर) है, जबकि विस्थापन क्षैतिज है। दोनों लंबवत होने से W = F d cos90° = 0।", "e": ["बैग भारी होना कार्य को ऋणात्मक नहीं बनाता।", "बल गति का विरोध नहीं कर रहा; वह ऊपर की ओर है।", "आगे ले जाना कार्य धनात्मक नहीं बनाता, क्योंकि बल विस्थापन के लंबवत है।", "सही – बल विस्थापन के लंबवत, इसलिए कार्य शून्य।"]}, {"n": 81, "s": "भौतिक विज्ञान", "q": "किसी बच्चे का निकट बिंदु 50 cm है, परंतु एक मानव नेत्र के लिए सामान्य निकट बिंदु 25 cm होता है। बच्चे के निकट बिंदु को ठीक करने के लिए आवश्यक लेंस क्षमता कितनी होगी?", "o": ["+2.0 D", "-2.0 D", "+1.0 D", "-1.0 D"], "a": 0, "c": "निकट बिंदु 50 cm (दीर्घ-दृष्टि दोष) ठीक करने के लिए उत्तल लेंस चाहिए। u = −25 cm, v = −50 cm; 1/f = 1/v − 1/u = 1/50, f = 50 cm = 0.5 m, क्षमता P = 1/f = +2 ाती है।", "काँच में चाल बढ़ती नहीं, घटती है।"]}, {"n": 85, "s": "जीव विज्ञान", "q": "दीर्घस्थायी गर्म वायुमंडल, जल चक्र के भीतर वर्षण पैटर्न को किस प्रकार परिवर्तित कर सकता है?", "o": ["यह सभी क्षेत्रों में सदैव हल्की वर्षा बढ़ाएगा", "यह अधिक तीव्र और अनियमित वर्षा का कारण बन सकता है", "यह सभी क्षेत्रों में अतिरिक्त हिमपात का कारण बनेगा", "इसके परिणामस्वरूप विश्व भर में कम वर्षा होगी"], "a": 1, "c": "दीर्घकालिक तापन से वाष्पीकरण बढ़ता है और जल-चक्र अस्थिर होता है; इससे तीव्र और अनियमित वर्षा (बाढ़/सूखा) की संभावना बढ़ती है।", "e": ["सभी क्षेत्रों में केवल हल्की वर्षा बढ़ना सही नहीं।", "सही – अधिक तीव्र और अनियमित वर्षा संभव है।", "सभी क्षेत्रों में अधिक हिमपात नहीं होगा; कई जगह हिम घटेगा।", "विश्वभर में केवल कम वर्षा नहीं होगी; कुछ जगह अधिक भी होगी।"]}, {"n": 86, "s": "जीव विज्ञान", "q": "किसी जीव के शरीर के लिए विश्राम की अवधि के दौरान जीवन प्रक्रियाओं को पूरा करना क्यों आवश्यक है?", "o": ["जनन में तेजी लाने के लिए", "उत्तरजीविता के लिए शरीर के महत्वपूर्ण कार्यों को जारी रखना सुनिश्चित करने के लिए", "शरीर को आकस्मिक संचलन हेतु तैयार करने के लिए", "मस्तिष्क के कार्यों को रीसेट करने के लिए"], "a": 1, "c": "विश्राम के दौरान भी श्वसन, परिसंचरण, उत्सर्जन जैसी जीवन प्रक्रियाएँ चलती रहती हैं, ताकि शरीर जीवित रहे।", "e": ["जनन तेज़ करना इनका उद्देश्य नहीं।", "सही – उत्तरजीविता के लिए आवश्यक कार्य जारी रहने चाहिए।", "आकस्मिक संचलन की तैयारी मुख्य कारण नहीं।", "मस्तिष्क को 'रीसेट' करना जीवन प्रक्रियाओं का उद्देश्य नहीं।"]}, {"n": 87, "s": "जीव विज्ञान", "q": "एक प्रतिवर्ती चाप में, ग्राही सबसे पहले ______ का पता लगाता है।", "o": ["उद्दीपक", "हार्मोन", "प्रभावक", "अनुक्रिया"], "a": 0, "c": "प्रतिवर्ती चाप: उद्दीपक → ग्राही → संवेदी तंत्रिका → मेरुरज्जु → चालक तंत्रिका → प्रभावक। ग्राही सबसे पहले उद्दीपक को पहचानता है।", "e": ["सही – ग्राही उद्दीपक का पता लगाता है।", "हार्मोन रासायनिक संदेशवाहक हैं, ग्राही का पहला पता लगाने वाला कारक नहीं।", "प्रभावक अंत में अनुक्रिया करता है।", "अनुक्रिया अंत में होती है।"]}, {"n": 88, "s": "जीव विज्ञान", "q": "लंबी दूरी तक तंत्रिका आवेगों को वहन करने के लिए, एक न्यूरल प्रोस्थेटिक को न्यूरॉन के किस भाग का अनुकरण करना चाहिए?", "o": ["माइलिन आच्छद वाला दीर्घित ऐक्सॉन", "केंद्रक युक्त कोशिका काय", "न्यूरॉन के अंत में स्थित सिनेप्टिक टर्मिनल", "कोशिका काय के निकट स्थित शाखित डेंड्राइट"], "a": 0, "c": "दूर तक आवेग ले जाने का कार्य ऐक्सॉन करता है, जो लंबा होता है और माइलिन आच्छद से आवेग तेज़ चलता है।", "e": ["सही – माइलिन आच्छद वाला दीर्घित ऐक्सॉन।", "कोशिका काय में केंद्रक होता है; यह आवेग का दूरवर्ती संवहन नहीं करती।", "सिनेप्टिक टर्मिनल आवेग को अगली कोशिका को देता है।", "डेन्ड्राइट आवेग ग्रहण करते हैं।"]}, {"n": 89, "s": "रसायन विज्ञान", "q": "परमाणु में इलेक्ट्रॉन का आवेश और स्थान क्या है?", "o": ["ऋणात्मक, नाभिक के बाहर", "धनात्मक, नाभिक के अंदर", "ऋणात्मक, नाभिक के अंदर", "उदासीन, नाभिक के अंदर"], "a": 0, "c": "इलेक्ट्रॉन ऋणावेशित होते हैं और नाभिक के बाहर कक्षाओं में रहते हैं।", "e": ["सही – ऋणात्मक, नाभिक के बाहर।", "धनात्मक आवेश प्रोटॉन का है, इलेक्ट्रॉन का नहीं।", "इलेक्ट्रॉन नाभिक के अंदर नहीं रहते।", "इलेक्ट्रॉन उदासीन नहीं, ऋणावेशित है; न्यूट्रॉन उदासीन है।"]}, {"n": 90, "s": "भौतिक विज्ञान", "q": "कोई विद्यार्थी 15 cm फोकस दूरी के उत्तल लेंस के सामने 30 cm दूरी पर एक वस्तु रखता है। लेंस सूत्र के आधार पर, प्रतिबिंब कहाँ बनेगा?", "o": ["लेंस के दूसरी तरफ 15 cm की दूरी पर", "लेंस के दूसरी तरफ 60 cm की दूरी पर", "लेंस के दूसरी तरफ 30 cm की दूरी पर", "लेंस के दूसरी तरफ 45 cm की दूरी पर"], "a": 2, "c": "उत्तल लेंस में f = +15 cm, u = −30 cm। 1/v = 1/f + 1/u = 1/15 − 1/30 = 1/30, अतः v = 30 cm; वस्तु 2F पर हो तो प्रतिबिंब 2F पर बनता है।", "e": ["15 cm फोकस दूरी है, प्रतिबिंब की दूरी नहीं।", "60 cm गलत गणना है।", "सही – लेंस के दूसरी ओर 30 cm पर।", "45 cm गलत गणना है।"]}];
const KEY='rrb_sci_8oct_s3_v1',TOTAL=1200,WARN=300,N=Q.length,L=['A','B','C','D'];
let mem=null,st=load(),tick=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||mem}catch(e){return mem}}
function save(){mem=JSON.parse(JSON.stringify(st));try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const $=id=>document.getElementById(id),app=$('app'),tm=$('timer');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function oh(q,i){return q.h?q.o[i]:esc(q.o[i])}
function newTest(){st={phase:'run',end:Date.now()+TOTAL*1000,ans:{},vis:{0:1},cur:0};save();run()}
function remain(){return Math.max(0,Math.ceil((st.end-Date.now())/1000))}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><h2>निर्देश</h2><ul><li>कुल प्रश्न: ${N} (भौतिक, रसायन और जीव विज्ञान) – RRB Technician Gr-III, 8 अक्टूबर 2026, Third Shift (4:30 PM)।</li><li>समय: ठीक 20 मिनट। समय समाप्त होते ही टेस्ट अपने-आप जमा हो जाएगा।</li><li>अंकन: सही उत्तर पर +1, गलत उत्तर पर −1/3 (मूल PDF में दिया गया नियम)। उत्तर न देने पर 0।</li><li>पेज Refresh करने पर बचा हुआ समय और आपके उत्तर सुरक्षित रहेंगे।</li><li>उत्तर कुंजी और व्याख्या टेस्ट जमा करने के बाद ही दिखेगी।</li></ul><button class="p" onclick="newTest()">टेस्ट शुरू करें</button></div>`;tm.classList.add('hide')}
function run(){tm.classList.remove('hide');draw();clearInterval(tick);tick=setInterval(tk,250);tk()}
function tk(){const r=remain();tm.textContent=fmt(r);tm.classList.toggle('warn',r<=WARN);if(r<=0){clearInterval(tick);submit(true)}}
function stat(){let a=Object.keys(st.ans).length;return[a,N-a]}
function draw(){const q=Q[st.cur],[a,u]=stat(),i=st.cur;st.vis[i]=1;save();
 let pal='';Q.forEach((x,j)=>{const c=(st.ans[j]!==undefined?'a':st.vis[j]?'v':'')+(j===i?' c':'');pal+=`<button class="${c}" onclick="go(${j})">${j+1}</button>`});
 app.innerHTML=`<div class="grid"><div class="card"><div><b>प्रश्न ${i+1} / ${N}</b><span class="tag">${q.s}</span></div><p style="font-size:1.08rem">${esc(q.q)}</p><div>${q.o.map((_,k)=>`<button class="opt ${st.ans[i]===k?'sel':''}" onclick="pick(${k})"><b>${L[k]}.</b> ${oh(q,k)}</button>`).join('')}</div><div class="bar"><button onclick="go(${i-1})" ${i?'':'disabled'}>← Previous</button><button onclick="go(${i+1})" ${i<N-1?'':'disabled'}>Next →</button><button onclick="clr()">Clear Response</button><span class="sp"></span><button class="d" onclick="ask()">Submit Test</button></div></div>
 <div class="card"><div class="st"><div><b style="color:var(--ok)">${a}</b>Attempted</div><div><b style="color:var(--no)">${u}</b>Unattempted</div></div><div class="pal">${pal}</div><div class="lg"><i style="background:var(--ok)"></i>उत्तर दिया<i style="background:#f6c9c5"></i>देखा, उत्तर नहीं<i style="background:var(--gr)"></i>नहीं देखा</div></div></div>`}
function go(j){if(j<0||j>=N)return;st.cur=j;draw()}
function pick(k){st.ans[st.cur]=k;draw()}
function clr(){delete st.ans[st.cur];draw()}
function ask(){const [a,u]=stat(),m=document.createElement('div');m.className='modal';m.id='mod';m.innerHTML=`<div class="card"><h3>टेस्ट जमा करें?</h3><p>Attempted: ${a} | Unattempted: ${u}<br>जमा करने के बाद उत्तर बदले नहीं जा सकेंगे।</p><div class="bar"><button onclick="$('mod').remove()">वापस जाएँ</button><span class="sp"></span><button class="d" onclick="submit(false)">हाँ, जमा करें</button></div></div>`;document.body.appendChild(m)}
function calc(ans){let c=0,w=0,s=0;Q.forEach((q,i)=>{if(ans[i]===undefined)s++;else if(ans[i]===q.a)c++;else w++});
 const sc=Math.round((c-w/3)*100)/100,att=c+w;return{c,w,s,sc,acc:att?Math.round(c/att*1000)/10:0}}
function submit(auto){clearInterval(tick);const m=$('mod');if(m)m.remove();st.phase='done';st.auto=!!auto;save();result()}
let flt='all';
function result(){tm.classList.add('hide');const r=calc(st.ans);
 const sub={};Q.forEach((q,i)=>{const o=sub[q.s]||(sub[q.s]={t:0,c:0,w:0});o.t++;if(st.ans[i]!==undefined){st.ans[i]===q.a?o.c++:o.w++}});
 let rev='';Q.forEach((q,i)=>{const u=st.ans[i],stt=u===undefined?'s':u===q.a?'c':'w';if(flt!=='all'&&flt!==stt)return;
  rev+=`<div class="card"><b>प्रश्न ${i+1}</b><span class="tag">${q.s}</span> <span class="${stt=='c'?'ok-t':stt=='w'?'no-t':'sk-t'}">${stt=='c'?'सही':stt=='w'?'गलत':'छोड़ा गया'}</span><p>${esc(q.q)}</p>${q.o.map((_,k)=>`<div class="ro ${k===q.a?'ok':u===k?'bad':''}"><b>${L[k]}.</b> ${oh(q,k)} ${k===q.a?'✔ सही उत्तर':''}${u===k&&k!==q.a?'✘ आपका उत्तर':''}${u===k&&k===q.a?' (आपका उत्तर)':''}<small>${esc(q.e[k])}</small></div>`).join('')}<div class="cpt"><b>अवधारणा:</b> ${esc(q.c)}</div></div>`});
 app.innerHTML=`<div class="card"><h2>परिणाम ${st.auto?'(समय समाप्त – Auto-Submit)':''}</h2><div class="stats"><div><b>${r.sc}/${N}</b>कुल स्कोर</div><div><b class="ok-t">${r.c}</b>सही</div><div><b class="no-t">${r.w}</b>गलत</div><div><b>${r.s}</b>छोड़े गए</div><div><b>${r.acc}%</b>Accuracy</div></div><p style="color:var(--mu)">स्कोर = सही − (गलत ÷ 3)। Accuracy = सही ÷ किए गए प्रश्न × 100।</p>
 <table><tr><th>विषय</th><th>प्रश्न</th><th>सही</th><th>गलत</th></tr>${Object.keys(sub).map(k=>`<tr><td>${k}</td><td>${sub[k].t}</td><td>${sub[k].c}</td><td>${sub[k].w}</td></tr>`).join('')}</table>
 <div class="bar"><button class="p" onclick="newTest()">Retake (नया 20:00 Timer)</button><span class="sp"></span>${[['all','सभी'],['w','गलत'],['s','छोड़े गए'],['c','सही']].map(f=>`<button ${flt===f[0]?'class="p"':''} onclick="flt='${f[0]}';result()">${f[1]}</button>`).join('')}</div></div>${rev}`}
if(!st)start();else if(st.phase==='done')result();else if(remain()<=0)submit(true);else run();
</script>
