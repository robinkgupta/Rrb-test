<head>

<title>RRB Technician Science Quiz – 9 October, First Shift</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#5b6578;--br:#d5dbe8;--pr:#1f4fd8;--ok:#1a8f4c;--no:#d1382f;--wa:#e8a100;--gr:#c9cfdc}
@media(prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1a2030;--tx:#e7ebf4;--mu:#9aa5bb;--br:#2e374c;--pr:#6c93ff;--ok:#3fc27a;--no:#ff6b61;--wa:#ffc23d;--gr:#3a435a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Devanagari","Mangal","Nirmala UI",system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--br);padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:1rem;margin:0}.wrap{max-width:1050px;margin:0 auto;padding:14px}
#timer{font:700 1.3rem/1 ui-monospace,Consolas,monospace;padding:7px 12px;border-radius:8px;border:2px solid var(--br)}
#timer.warn{color:#fff;background:var(--no);border-color:var(--no);animation:bl 1s infinite}@keyframes bl{50%{opacity:.55}}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 290px;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--br);background:var(--card);color:var(--tx);padding:9px 14px}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.d{background:var(--no);color:#fff;border-color:var(--no)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 12px;border-width:2px}.opt.sel{border-color:var(--pr);background:rgba(31,79,216,.12)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar .sp{flex:1}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.pal button{padding:7px 0;font-weight:700;background:var(--gr);border-color:var(--gr)}
.pal .v{background:#f6c9c5;border-color:#f6c9c5;color:#7a1a14}.pal .a{background:var(--ok);border-color:var(--ok);color:#fff}.pal .c{outline:3px solid var(--pr);outline-offset:1px}
.lg{font-size:.85rem;color:var(--mu);margin-top:10px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 8px;vertical-align:middle}
.st{display:flex;gap:8px;margin-bottom:10px}.st div{flex:1;text-align:center;border:1px solid var(--br);border-radius:8px;padding:6px}.st b{display:block;font-size:1.2rem}
.tag{font-size:.78rem;background:var(--br);border-radius:99px;padding:2px 9px;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stats div{text-align:center;border:1px solid var(--br);border-radius:10px;padding:10px}.stats b{display:block;font-size:1.5rem}
.ro{margin:7px 0;padding:9px 11px;border-radius:8px;border:1px solid var(--br)}.ro.ok{border-color:var(--ok);background:rgba(26,143,76,.13)}.ro.bad{border-color:var(--no);background:rgba(209,56,47,.12)}
.ro small{display:block;color:var(--mu)}.cpt{background:rgba(232,161,0,.15);border-left:4px solid var(--wa);padding:8px 12px;border-radius:6px;margin:8px 0}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--br);padding:6px;text-align:center}
.ok-t{color:var(--ok);font-weight:700}.no-t{color:var(--no);font-weight:700}.sk-t{color:var(--mu);font-weight:700}
.hide{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.modal .card{max-width:420px;margin:0}
</style>

<header><h1>RRB Technician Science Quiz – 9 October, First Shift</h1><div id="timer" class="hide">20:00</div></header>
<div class="wrap" id="app"></div>
<script>
const Q=[{"n": 51, "s": "रसायन विज्ञान", "q": "कौन-सा आवेशित कण, किसी तत्व का परमाणु क्रमांक निर्धारित करता है?", "o": ["संपूर्ण परमाणु का द्रव्यमान", "नाभिक में उपस्थित प्रोटॉन", "बाह्यतम कोश में इलेक्ट्रॉन", "नाभिक में उपस्थित न्यूट्रॉन"], "a": 1, "c": "परमाणु क्रमांक = नाभिक में प्रोटॉनों की संख्या। यही तत्व की पहचान तय करता है।", "e": ["द्रव्यमान संख्या से संबंधित है, परमाणु क्रमांक से नहीं।", "सही – प्रोटॉन आवेशित कण है और Z निर्धारित करता है।", "उदासीन परमाणु में इलेक्ट्रॉन संख्या Z के बराबर होती है, पर Z को निर्धारित प्रोटॉन करते हैं।", "न्यूट्रॉन आवेशहीन है और Z तय नहीं करता।"]}, {"n": 52, "s": "जीव विज्ञान", "q": "जल की तुलना में भूमि के शीघ्र ठंडा होने के कारण, रात के समय सामान्यतः कौन-सी स्थानीय पवन चलती है?", "o": ["थल समीर", "समुद्र समीर", "मानसून", "पश्चिमी पवनें"], "a": 0, "c": "दिन में भूमि जल से जल्दी गर्म और रात में जल्दी ठंडी होती है। रात में समुद्र ऊपर की हवा गर्म रहती है, इसलिए हवा थल (भूमि) से समुद्र की ओर चलती है – थल समीर।", "e": ["सही – रात में भूमि से समुद्र की ओर चलने वाली पवन।", "समुद्र समीर दिन में समुद्र से भूमि की ओर चलती है।", "मानसून मौसमी पवन है, दैनिक स्थानीय पवन नहीं।", "पश्चिमी पवनें वैश्विक (ग्रहीय) पवनें हैं।"]}, {"n": 53, "s": "भौतिक विज्ञान", "q": "किसी विज्ञान परियोजना के लिए विद्यार्थियों को किसी भारी वस्तु को कम से कम आयास बल के साथ उठाने के लिए प्रथम- श्रेणी के लीवर को समायोजित करने की आवश्यकता होती है। किस समायोजन से उन्हें सबसे अधिक यांत्रिक लाभ प्राप्त होगा?", "o": ["लोड को आलंब से यथासंभव दूर रखना", "लोड भुजा को छोटा रखते हुए आयास भुजा की लंबाई को न्यूनतम करना", "लोड के वजन पर विचार किए बिना आलंब को ठीक केंद्र में रखना", "लोड भुजा को लंबा रखते हुए आयास भुजा की लंबाई को अधिकतम करना"], "a": 3, "c": "प्रथम श्रेणी लीवर में यांत्रिक लाभ = आयास भुजा ÷ भार भुजा। आयास भुजा जितनी लंबी होगी, कम बल से भार उठेगा। (नोट: विकल्प D में 'भार भुजा लंबी' का कथन आदर्श नहीं है, पर मूल कुंजी में D ही सही माना गया है क्योंकि आयास भुजा अधिकतम करना यहाँ मुख्य बिंदु है।)", "e": ["भार को आलंब से दूर रखने पर भार भुजा बढ़ती है और यांत्रिक लाभ घटता है।", "आयास भुजा न्यूनतम करने से यांत्रिक लाभ कम होगा।", "आलंब ठीक केंद्र में रखने पर यांत्रिक लाभ 1 रहता है, अधिकतम नहीं।", "सही (मूल कुंजी अनुसार) – आयास भुजा अधिकतम करने से यांत्रिक लाभ बढ़ता है।"]}, {"n": 54, "s": "जीव विज्ञान", "q": "किशोरों में तंबाकू के उपयोग को कम करने के लिए कौन-सी रणनीति सबसे प्रभावी है?", "o": ["बिना स्पष्टीकरण के ग्राफिक प्रतिबिंब दिखाना", "विद्यार्थियों के लिए खेल उपकरण उपलब्ध कराना", "कार्यशालाओं के माध्यम से स्वास्थ्य संबंधी जोखिमों के संबंध में बताना", "सामान्य जानकारी वाले पर्चे वितरित करना"], "a": 2, "c": "तंबाकू से कैंसर, हृदय व फेफड़ों के रोग होते हैं। किशोरों में जागरूकता कार्यशालाओं में स्पष्ट जानकारी देना सबसे प्रभावी रणनीति है।", "e": ["बिना स्पष्टीकरण के भयावह चित्र दिखाने से समझ नहीं बनती।", "खेल उपकरण अच्छे हैं, पर सीधे तंबाकू के जोखिम नहीं समझाते।", "सही – स्वास्थ्य जोखिमों की जानकारी से सोच बदलती है।", "सामान्य पर्चे कम प्रभावी होते हैं।"]}, {"n": 55, "s": "रसायन विज्ञान", "q": "इलेक्ट्रोलाइट मिलाकर कोलाइडल कणों को नीचे बैठाने की प्रक्रिया को क्या कहते हैं?", "o": ["पेप्टीकरण (peptisation)", "अपोहन (dialysis)", "पायसीकरण (emulsification)", "स्कंदन (coagulation)"], "a": 3, "c": "कोलॉइड में इलेक्ट्रोलाइट मिलाने पर कणों का आवेश निष्प्रभावी हो जाता है, कण जुड़कर बड़े होकर नीचे बैठ जाते हैं – इसे स्कंदन कहते हैं।", "e": ["पेप्टीकरण में अवक्षेप को इलेक्ट्रोलाइट से कोलॉइड में बदला जाता है (उल्टी क्रिया)।", "अपोहन कोलॉइड से अशुद्धियाँ हटाने की विधि है।", "पायसीकरण दो अमिश्रणीय द्रवों का पायस बनाना है।", "सही – स्कंदन (coagulation)।"]}, {"n": 56, "s": "जीव विज्ञान", "q": "एक वनस्पति विज्ञानी किसी फसली पादप को आनुवंशिक रूप से संशोधित करने का प्रयास कर रही है ताकि उसकी लंबाई और क्षति के बाद मरम्मत क्षमता बढ़ाई जा सके । पादप को अधिक प्रभावी बनाने के लिए उसे पादप के किस ऊतक को बेहतर बनाने पर फोकस करना चाहिए?", "o": ["विभज्योतक को बेहतर बनाने पर फोकस करना चाहिए क्योंकि यह वृद्धि और पुनर्जनन को प्रेरित करता है", "बाह्यत्वचीय ऊतक को बेहतर बनाने पर फोकस करना चाहिए क्योंकि यह रोगजनकों से बचाता है", "भरण ऊतक को बेहतर बनाने पर फोकस करना चाहिए क्योंकि यह भोजन का भंडारण करता है", "संवहन ऊतक को बेहतर बनाने पर फोकस करना चाहिए क्योंकि यह पोषक तत्वों और जल का परिवहन करता है"], "a": 0, "c": "विभज्योतक ऊतक की कोशिकाएँ लगातार विभाजित होती हैं, इसलिए वृद्धि (लंबाई) और क्षति-पश्चात मरम्मत इसी पर निर्भर करती है।", "e": ["सही – विभज्योतक वृद्धि व पुनर्जनन कराता है।", "बाह्यत्वचा सुरक्षा देती है, लंबाई/मरम्मत नहीं बढ़ाती।", "भरण ऊतक भोजन भंडारण व सहारा देता है।", "संवहन ऊतक परिवहन करता है, वृद्धि नहीं कराता।"]}, {"n": 57, "s": "भौतिक विज्ञान", "q": "यदि एक साइकिल चालक 'T' घंटे में 'D' किलोमीटर की दूरी तय करता है, तो औसत चाल का सही सूत्र कौन-सा है?", "o": ["औसत चाल = D - T", "औसत चाल = D x T", "औसत चाल = T/D", "औसत चाल = D/T"], "a": 3, "c": "औसत चाल = कुल दूरी ÷ कुल समय = D/T।", "e": ["घटाने से चाल नहीं मिलती।", "गुणा करने से चाल नहीं मिलती (D×T अर्थहीन है)।", "यह समय/दूरी है, जो चाल का व्युत्क्रम है।", "सही – औसत चाल = D/T।"]}, {"n": 58, "s": "भौतिक विज्ञान", "q": "गोलीय दर्पणों के संदर्भ में, ध्रुव पर अभिलंब और मुख्य अक्ष के बीच क्या संबंध है?", "o": ["मुख्य अक्ष, ध्रुव पर दर्पण के पृष्ठ के साथ 45-डिग्री का कोण बनाता है", "मुख्य अक्ष, ध्रुव पर दर्पण के पृष्ठ के लंबवत होता है", "मुख्य अक्ष, ध्रुव पर दर्पण के पृष्ठ की स्पर्शरेखा होती है", "मुख्य अक्ष, ध्रुव पर दर्पण के पृष्ठ के समांतर होता है"], "a": 1, "c": "गोलीय दर्पण के ध्रुव पर अभिलंब, मुख्य अक्ष के साथ संपाती होता है, अर्थात् मुख्य अक्ष ध्रुव पर पृष्ठ के लंबवत होता है।", "e": ["45° कोण नहीं बनता।", "सही – मुख्य अक्ष पृष्ठ के लंबवत है (अभिलंब के अनुदिश)।", "स्पर्शरेखा पृष्ठ के साथ होती है, मुख्य अक्ष नहीं।", "समांतर होने पर वह पृष्ठ को स्पर्श ही नहीं करेगा।"]}, {"n": 59, "s": "जीव विज्ञान", "q": "दीर्घ स्थायी उच्च रक्तचाप से, ________ का जोखिम बढ़ सकता है।", "o": ["हृदय रोग और आघात", "बेहतर रक्त परिसंचरण", "तेजी से भोजन पाचन", "ऑक्सीजन उत्पादन में वृद्धि"], "a": 0, "c": "लंबे समय तक उच्च रक्तचाप धमनियों व हृदय पर दबाव डालता है, जिससे हृदय रोग, आघात (स्ट्रोक) और गुर्दे की क्षति का खतरा बढ़ता है।", "e": ["सही – हृदय रोग और आघात का जोखिम बढ़ता है।", "उच्च रक्तचाप परिसंचरण बेहतर नहीं करता।", "पाचन पर यह सीधा लाभ नहीं देता।", "यह ऑक्सीजन उत्पादन से संबंधित नहीं है।"]}, {"n": 60, "s": "भौतिक विज्ञान", "q": "वर्षा के पश्चात इंद्रधनुष तब दिखाई देता है जब सूर्य का प्रकाश वायु में जल की बूंदों से होकर गुजरता है। इंद्रधनुष में रंगों के पृथक दिखाई देने का मुख्य कारण निम्नलिखित में से कौन-सी प्रक्रिया है?", "o": ["वर्षा की बूंदों की सतह से सूर्य के प्रकाश का परावर्तन", "वायु के अणुओं द्वारा सूर्य के प्रकाश का प्रकीर्णन", "जल की बूंदों में सूर्य के प्रकाश का अपवर्तन और उसके बाद परिक्षेपण", "जल की बूंदों द्वारा सूर्य के प्रकाश का अवशोषण"], "a": 2, "c": "इंद्रधनुष में जल की बूंद में प्रकाश का अपवर्तन होता है, फिर भीतर परावर्तन और बाहर निकलते समय परिक्षेपण – अलग रंग अलग कोणों पर मुड़कर पृथक दिखते हैं।", "e": ["केवल परावर्तन से रंग पृथक नहीं होते।", "वायु के अणुओं का प्रकीर्णन आकाश का नीला रंग बनाता है।", "सही – अपवर्तन और उसके बाद परिक्षेपण।", "अवशोषण रंग अलग नहीं करता।"]}, {"n": 61, "s": "रसायन विज्ञान", "q": "निम्नलिखित में से कौन-सा कथन सर्वोत्तम रूप से यह स्पष्ट करता है कि उत्कृष्ट गैसों की संयोजकता शून्य क्यों होती है?", "o": ["क्योंकि वे किसी भी स्थिति में आयन नहीं बना सकते हैं", "क्योंकि वे आवर्त सारणी में सबसे छोटे परमाणु होते हैं", "क्योंकि उनके बाह्य कोश में अभिक्रिया करने के लिए कोई इलेक्ट्रॉन नहीं होता है", "क्योंकि उनका बाह्यतम कोश पहले से ही पूर्ण और स्थायी होता है"], "a": 3, "c": "उत्कृष्ट गैसों का बाह्यतम कोश पूर्ण (8 या He में 2 इलेक्ट्रॉन) और स्थायी होता है, इसलिए वे इलेक्ट्रॉन लेते-देते या साझा नहीं करते – संयोजकता शून्य।", "e": ["कुछ स्थितियों में (जैसे XeF₂) ये यौगिक बना सकती हैं, कथन अतिशयोक्ति है।", "ये सबसे छोटे परमाणु नहीं हैं (हाइड्रोजन छोटा है)।", "इनके बाह्य कोश में इलेक्ट्रॉन होते हैं, वे पूर्ण हैं।", "सही – पूर्ण बाह्यतम कोश स्थायी होता है।"]}, {"n": 62, "s": "रसायन विज्ञान", "q": "निम्नलिखित में से कौन-सा विकल्प सर्वोत्‍तम रूप से यह वर्णन करता है, कि ऑटोमोबाइल में पेट्रोल की तुलना में एथेनॉल को मार्जक ईंधन (cleaner fuel) क्यों माना जाता है?", "o": ["दहन के दौरान एथेनॉल से कम हानिकारक उत्सर्जन होता है", "एथेनॉल इंजन के पुर्ज़ों में अधिक संक्षारण का कारण बनता है", "पेट्रोल की तुलना में एथेनॉल में प्रति ग्राम अधिक ऊर्जा होती है", "पेट्रोल की तुलना में एथेनॉल का भंडारण और परिवहन अधिक कठिन होता है"], "a": 0, "c": "एथेनॉल के दहन से CO, कणीय पदार्थ आदि कम हानिकारक उत्सर्जन होते हैं, इसलिए यह मार्जक (स्वच्छ) ईंधन माना जाता है।", "e": ["सही – कम हानिकारक उत्सर्जन।", "संक्षारण अधिक होना कमी है, स्वच्छता का कारण नहीं।", "एथेनॉल में प्रति ग्राम ऊर्जा पेट्रोल से कम होती है।", "भंडारण कठिन होना कमी है, स्वच्छता का कारण नहीं।"]}, {"n": 63, "s": "भौतिक विज्ञान", "q": "2 kg द्रव्यमान के एक पिंड को 5 m की ऊंचाई पर रखा गया है। इसकी स्थितिज ऊर्जा _______________ है। (g=10 m/s2 का उपयोग कीजिए।)", "o": ["50 J", "5 J", "10 J", "100 J"], "a": 3, "c": "स्थितिज ऊर्जा PE = mgh = 2 × 10 × 5 = 100 J।", "e": ["50 J गलत गणना है (g=10 की जगह 5 से गुणा)।", "5 J गलत गणना है।", "10 J गलत गणना है।", "सही – 100 J।"]}, {"n": 64, "s": "भौतिक विज्ञान", "q": "जब भिन्न द्रव्यमानों वाले दो पिंडों को समान दर से त्वरित किया जाता है, तो न्यूटन के द्वितीय नियम के अनुसार उन पर लगने वाले बलों के संबंध में क्या अनुमान लगाया जा सकता है?", "o": ["दोनों पिंड समान बल का अनुभव करते हैं क्योंकि त्वरण समान है।", "तेजी से गतिमान होने के कारण हल्का पिंड अधिक बल का अनुभव करता है।", "जब त्वरण नियत होता है, तो बल द्रव्यमान पर निर्भर नहीं करता है।", "द्रव्यमान अधिक होने के कारण भारी पिंड अधिक बल का अनुभव करता है।"], "a": 3, "c": "न्यूटन का द्वितीय नियम F = ma। समान त्वरण पर बल द्रव्यमान के समानुपाती है, अतः अधिक द्रव्यमान पर अधिक बल लगेगा।", "e": ["द्रव्यमान भिन्न हैं, इसलिए बल समान नहीं होंगे।", "हल्के पिंड पर कम बल लगेगा।", "त्वरण नियत होने पर भी बल द्रव्यमान पर निर्भर करता है।", "सही – भारी पिंड पर अधिक बल।"]}, {"n": 65, "s": "भौतिक विज्ञान", "q": "एक छात्र, बिंदु X और Y के बीच, कॉपर के तार को प्लास्टिक के धागे से प्रतिस्थापित करके प्रयोग में संशोधन करता है, जबकि अन्य सभी परिस्थितियाँ समान रहती हैं। कम्पास की सुई के संबंध में प्रत्याशित अवलोकन क्या होगा और क्यों?", "o": ["प्लास्टिक में प्रतिरोध बढ़ने के कारण कम्पास की सुई अधिक तीव्रता से विक्षेपित होगी।", "प्लास्टिक, कॉपर की तुलना में दुर्बल चुंबकीय क्षेत्र बनाता है, इसलिए कम्पास की सुई कम विक्षेपित होगी।", "धागे और आलंब के बीच घर्षण के कारण कम्पास की सुई बहुत कम विक्षेपित होगी।", "कम्पास की सुई विक्षेपित नहीं होगी क्योंकि प्लास्टिक विद्युत का चालन नहीं करता है और इसलिए कोई चुंबकीय क्षेत्र उत्पन्न नहीं होगा।"], "a": 3, "c": "विद्युत धारा से चुंबकीय क्षेत्र बनता है। प्लास्टिक विद्युतरोधी है, इसलिए धारा नहीं बहेगी और कम्पास की सुई विक्षेपित नहीं होगी (ऑर्स्टेड का प्रयोग)।", "e": ["प्लास्टिक का प्रतिरोध बहुत अधिक है, इससे धारा बंद हो जाती है, विक्षेप नहीं बढ़ता।", "प्लास्टिक कमजोर चुंबकीय क्षेत्र नहीं बनाता, कोई क्षेत्र ही नहीं बनता।", "घर्षण का विक्षेप से कोई संबंध नहीं।", "सही – धारा नहीं बहेगी, इसलिए चुंबकीय क्षेत्र नहीं।"]}, {"n": 66, "s": "रसायन विज्ञान", "q": "निम्नलिखित में से कौन-सा कथन, मिश्रण और विलयन के संबंध में कोलॉइड के गुण का सर्वोत्तम वर्णन करता है?", "o": ["कोलॉइड का निस्‍यंदन करने पर वह परतों में पृथक हो जाता है।", "कोलॉइड स्थिर रखने पर तली में बैठ जाता है परंतु प्रकाश का प्रकीर्णन नहीं करता है।", "कोलॉइड प्रकाश को प्रकीर्णित करता है लेकिन स्थिर रखने पर तली में बैठता नहीं है।", "कोलॉइड न तो प्रकाश का प्रकीर्णन करता है और न ही स्थिर रखने पर तली में बैठता है।"], "a": 2, "c": "कोलॉइड के कण निलंबन से छोटे व विलयन से बड़े होते हैं। वे प्रकाश का प्रकीर्णन करते हैं (टिंडल प्रभाव) और स्थिर रखने पर नीचे नहीं बैठते।", "e": ["कोलॉइड निस्यंदन से पृथक नहीं होता।", "कोलॉइड तली में नहीं बैठता और प्रकाश का प्रकीर्णन करता है।", "सही – प्रकाश प्रकीर्णित करता है, पर बैठता नहीं।", "कोलॉइड प्रकाश का प्रकीर्णन करता है।"]}, {"n": 67, "s": "रसायन विज्ञान", "q": "निम्नलिखित में से कौन-सा/से कथन सत्य है/हैं?\na. मिश्रधातु बनाकर लोहे में जंग लगने से रोका जा सकता है।\nb. स्टेनलेस स्टील मुख्य रूप से लोहे, क्रोमियम और निकैल की मिश्रधातु है।\nc. मिश्रधातु दो या दो से अधिक धातुओं का एक विषमांगी मिश्रण होता है।", "o": ["b और c", "केवल a", "a और b", "a और c"], "a": 2, "c": "मिश्रधातु बनाने से जंग रुक सकती है (स्टेनलेस स्टील)। स्टेनलेस स्टील लोहा, क्रोमियम और निकैल की मिश्रधातु है। मिश्रधातु विषमांगी नहीं, समांगी मिश्रण है, इसलिए कथन c असत्य है।", "e": ["c असत्य है।", "a भी सत्य है, इसलिए केवल a पूर्ण उत्तर नहीं।", "सही – a और b सत्य हैं।", "c असत्य है।"]}, {"n": 68, "s": "जीव विज्ञान", "q": "टेरिडोफाइट की कौन-सी विशेषता उन्हें सीमित आर्द्रता वाले स्थलों पर ब्रायोफाइट की तुलना में बेहतर ढंग से जीवित रहने में सहायता करती है?", "o": ["नर युग्मकों के संचलन के लिए जल पर निर्भरता", "वास्तविक जड़ों, तनों और पत्तियों की अनुपस्थिति", "केवल संपूर्ण पादप काय में प्रत्यक्ष रूप से जल का अवशोषण", "जल और पोषक तत्वों के परिवहन के लिए संवहनी ऊतकों की उपस्थिति"], "a": 3, "c": "टेरिडोफाइटा में संवहन ऊतक (जाइलम, फ्लोएम) होते हैं जो जल व पोषक तत्वों का परिवहन करते हैं, इसलिए ये सूखे स्थलों पर बेहतर जीवित रहते हैं।", "e": ["नर युग्मकों के लिए जल पर निर्भरता जीवित रहने में बाधा है, लाभ नहीं।", "टेरिडोफाइट में वास्तविक जड़, तना, पत्ती होते हैं।", "केवल सीधा अवशोषण ब्रायोफाइट की सीमा है।", "सही – संवहनी ऊतक की उपस्थिति।"]}, {"n": 69, "s": "जीव विज्ञान", "q": "वायुमंडल, पृथ्वी पर जीवन के लिए उपयुक्त तापमान बनाए रखने में किस प्रकार सहायता करता है?", "o": ["यह सतह तक पहुंचने वाली संपूर्ण ऊष्मा को रोक देता है", "यह संपूर्ण ऊष्मा को तीव्रता से अंतरिक्ष में जाने देता है", "यह सूर्य के प्रकाश को परावर्तित करके ग्रह को ठंडा करता है", "यह आने वाले सौर विकिरणों को आंशिक रूप से अवशोषित कर लेता है"], "a": 3, "c": "वायुमंडल की गैसें (ग्रीनहाउस प्रभाव) आने वाले विकिरण का एक भाग अवशोषित कर ऊष्मा रोकती हैं, जिससे पृथ्वी का तापमान जीवन योग्य रहता है।", "e": ["संपूर्ण ऊष्मा रुकने पर तापमान बहुत बढ़ जाएगा।", "संपूर्ण ऊष्मा बाहर जाने पर पृथ्वी बहुत ठंडी हो जाएगी।", "परावर्तन से कुछ ठंडक मिलती है, पर यह तापमान बनाए रखने की मुख्य व्याख्या नहीं।", "सही – आंशिक अवशोषण।"]}, {"n": 70, "s": "भौतिक विज्ञान", "q": "जब कोई गेंद किसी ऊंचाई से मुक्त रूप से गिरती है, तो ऊर्जा संरक्षण के नियम के अनुसार उसकी स्थितिज और गतिज ऊर्जा पर क्या प्रभाव पड़ता है?", "o": ["दोनों ऊर्जाएं एक ही समय पर कम हो जाती हैं।", "दोनों ऊर्जाएं तुरंत ऊष्मा के रूप में नष्ट हो जाती हैं।", "स्थितिज ऊ "], "a": 0, "c": "सक्रियता श्रेणी में शीर्ष की धातुएँ (K, Na, Ca, Al) अत्यधिक अभिक्रियाशील हैं, इसलिए उन्हें गलित अयस्क के विद्युत-अपघटन से निकाला जाता है।", "e": ["सही – विद्युत-अपघटन ही उपयुक्त है।", "कार्बन अपचयन कम अभिक्रियाशील धातुओं (Zn, Fe) के लिए है।", "सायनाइड निक्षालन सोने/चाँदी के लिए है।", "भर्जन सल्फाइड अयस्कों के लिए है।"]}, {"n": 74, "s": "भौतिक विज्ञान", "q": "उत्तल दर्पणों का कौन-सा गुणधर्म उन्हें सुरक्षा उद्देश्यों के लिए शॉपिंग मॉल में उपयोग के लिए उपयुक्त बनाता है?", "o": ["वे देखने का एक विस्तृत क्षेत्र प्रदान करते हैं।", "वे प्रतिबिंब का आवर्धन करते हैं।", "वे छवि को व्युत्क्रमित करते हैं।", "वे प्रकाश को समानांतर किरणों में परावर्तित करते हैं।"], "a": 0, "c": "उत्तल दर्पण सदैव सीधा, छोटा व आभासी प्रतिबिंब बनाता है और उसका दृष्टि क्षेत्र बहुत विस्तृत होता है। इसीलिए सुरक्षा व वाहन के साइड मिरर में उपयोग होता है।", "e": ["सही – विस्तृत दृश्य क्षेत्र।", "उत्तल दर्पण प्रतिबिंब को छोटा करता है, आवर्धन नहीं।", "प्रतिबिंब सीधा बनता है, व्युत्क्रमित नहीं।", "उत्तल दर्पण प्रकाश को अपसारित करता है।"]}, {"n": 75, "s": "जीव विज्ञान", "q": "कौन-सा ऊतक, फर्न के तने की अनुप्रस्थ-काट में पाया जा सकता है, परंतु ब्रायोफाइटा और थैलोफ़ाइटा में अनुपस्थित होता है?", "o": ["पर्ण छिद्र", "पर्णहरित", "संवहनी पूल", "मूल रोम"], "a": 2, "c": "फर्न टेरिडोफाइटा है, जिसमें जाइलम-फ्लोएम वाले संवहनी पूल होते हैं। ब्रायोफाइटा व थैलोफाइटा में संवहनी ऊतक नहीं होते।", "e": ["पर्ण छिद्र (रंध्र) ब्रायोफाइटा में भी होते हैं।", "पर्णहरित सभी में होता है।", "सही – संवहनी पूल केवल टेरिडोफाइट में।", "मूल रोम/मूलाभास ब्रायोफाइट में भी होते हैं।"]}, {"n": 76, "s": "रसायन विज्ञान", "q": "जलीय विलयनों में अम्लों और क्षारकों के व्यवहार के संबंध में निम्नलिखित कथनों पर विचार कीजिए तथा सही कथनों का चयन कीजिए।\n(I) अम्ल, जलीय विलयन में H⁺ आयन उत्पन्न करते हैं।\n(II) क्षारक, जलीय विलयन में OH⁻ आयन उत्पन्न करते हैं।\n(III) विलयन की अम्लीय प्रकृति, OH⁻ आयनों की उपस्थिति के कारण होती है।\n(IV) विलयन की क्षारकीय प्रकृति, OH⁻ आयनों की उपस्थिति के कारण होती है।", "o": ["केवल II और III", "केवल III और I function remain(){return Math.max(0,Math.ceil((st.end-Date.now())/1000))}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><h2>निर्देश</h2><ul><li>कुल प्रश्न: ${N} (भौतिक, रसायन और जीव विज्ञान) – RRB Technician Gr-III, 9 अक्टूबर 2026, First Shift (9:00 AM)।</li><li>समय: ठीक 20 मिनट। समय समाप्त होते ही टेस्ट अपने-आप जमा हो जाएगा।</li><li>अंकन: सही उत्तर पर +1, गलत उत्तर पर −1/3 (मूल PDF में दिया गया नियम)। उत्तर न देने पर 0।</li><li>पेज Refresh करने पर बचा हुआ समय और आपके उत्तर सुरक्षित रहेंगे।</li><li>उत्तर कुंजी और व्याख्या टेस्ट जमा करने के बाद ही दिखेगी।</li></ul><button class="p" onclick="newTest()">टेस्ट शुरू करें</button></div>`;tm.classList.add('hide')}
function run(){tm.classList.remove('hide');draw();clearInterval(tick);tick=setInterval(tk,250);tk()}
function tk(){const r=remain();tm.textContent=fmt(r);tm.classList.toggle('warn',r<=WARN);if(r<=0){clearInterval(tick);submit(true)}}
function stat(){let a=Object.keys(st.ans).length;return[a,N-a]}
function draw(){const q=Q[st.cur],[a,u]=stat(),i=st.cur;st.vis[i]=1;save();
 let pal='';Q.forEach((x,j)=>{const c=(st.ans[j]!==undefined?'a':st.vis[j]?'v':'')+(j===i?' c':'');pal+=`<button class="${c}" onclick="go(${j})">${j+1}</button>`});
 app.innerHTML=`<div class="grid"><div class="card"><div><b>प्रश्न ${i+1} / ${N}</b><span class="tag">${q.s}</span></div><p style="font-size:1.08rem;white-space:pre-line">${esc(q.q)}</p><div>${q.o.map((_,k)=>`<button class="opt ${st.ans[i]===k?'sel':''}" onclick="pick(${k})"><b>${L[k]}.</b> ${oh(q,k)}</button>`).join('')}</div><div class="bar"><button onclick="go(${i-1})" ${i?'':'disabled'}>← Previous</button><button onclick="go(${i+1})" ${i<N-1?'':'disabled'}>Next →</button><button onclick="clr()">Clear Response</button><span class="sp"></span><button class="d" onclick="ask()">Submit Test</button></div></div>
 <div class="card"><div class="st"><div><b style="color:var(--ok)">${a}</b>Attempted</div><div><b style="color:var(--no)">${u}</b>Unattempted</div></div><div class="pal">${pal}</div><div class="lg"><i style="background:var(--ok)"></i>उत्तर दिया<i style="background:#f6c9c5"></i>देखा, उत्तर नहीं<i style="background:var(--gr)"></i>नहीं देखा</div></div></div>`}
function go(j){if(j<0||j>=N)return;st.cur=j;draw()}
function pick(k){st.ans[st.cur]=k;draw()}
function clr(){delete st.ans[st.cur];draw()}
function ask(){const [a,u]=stat(),m=document.createElement('div');m.className='modal';m.id='mod';m.innerHTML=`<div class="card"><h3>टेस्ट जमा करें?</h3><p>Attempted: ${a} | Unattempted: ${u}<br>जमा करने के बाद उत्तर बदले नहीं जा सकेंगे।</p><div class="bar"><button onclick="$('mod').remove()">वापस जाएँ</button><span class="sp"></span><button class="d" onclick="submit(false)">हाँ, जमा करें</button></div></div>`;document.body.appendChild(m)}
function calc(ans){let c=0,w=0,s=0;Q.forEach((q,i)=>{if(ans[i]===undefined)s++;else if(ans[i]===q.a)c++;else w++});
 const sc=Math.round((c-w/3)*100)/100,att=c+w;return{c,w,s,sc,acc:att?Math.round(c/att*1000)/10:0}}
function submit(auto){clearInterval(tick);const m=$('mod');if(m)m.remove();st.phase='done';st.auto=!!auto;save();result()}
let flt='all';
function result(){tm.classList.add('hide');const r=calc(st.ans);
 const sub={};Q.forEach((q,i)=>{const o=sub[q.s]||(sub[q.s]={t:0,c:0,w:0});o.t++;if(st.ans[i]!==undefined){st.ans[i]===q.a?o.c++:o.w++}});
 let rev='';Q.forEach((q,i)=>{const u=st.ans[i],stt=u===undefined?'s':u===q.a?'c':'w';if(flt!=='all'&&flt!==stt)return;
  rev+=`<div class="card"><b>प्रश्न ${i+1}</b><span class="tag">${q.s}</span> <span class="${stt=='c'?'ok-t':stt=='w'?'no-t':'sk-t'}">${stt=='c'?'सही':stt=='w'?'गलत':'छोड़ा गया'}</span><p style="white-space:pre-line">${esc(q.q)}</p>${q.o.map((_,k)=>`<div class="ro ${k===q.a?'ok':u===k?'bad':''}"><b>${L[k]}.</b> ${oh(q,k)} ${k===q.a?'✔ सही उत्तर':''}${u===k&&k!==q.a?'✘ आपका उत्तर':''}${u===k&&k===q.a?' (आपका उत्तर)':''}<small>${esc(q.e[k])}</small></div>`).join('')}<div class="cpt"><b>अवधारणा:</b> ${esc(q.c)}</div></div>`});
 app.innerHTML=`<div class="card"><h2>परिणाम ${st.auto?'(समय समाप्त – Auto-Submit)':''}</h2><div class="stats"><div><b>${r.sc}/${N}</b>कुल स्कोर</div><div><b class="ok-t">${r.c}</b>सही</div><div><b class="no-t">${r.w}</b>गलत</div><div><b>${r.s}</b>छोड़े गए</div><div><b>${r.acc}%</b>Accuracy</div></div><p style="color:var(--mu)">स्कोर = सही − (गलत ÷ 3)। Accuracy = सही ÷ किए गए प्रश्न × 100।</p>
 <table><tr><th>विषय</th><th>प्रश्न</th><th>सही</th><th>गलत</th></tr>${Object.keys(sub).map(k=>`<tr><td>${k}</td><td>${sub[k].t}</td><td>${sub[k].c}</td><td>${sub[k].w}</td></tr>`).join('')}</table>
 <div class="bar"><button class="p" onclick="newTest()">Retake (नया 20:00 Timer)</button><span class="sp"></span>${[['all','सभी'],['w','गलत'],['s','छोड़े गए'],['c','सही']].map(f=>`<button ${flt===f[0]?'class="p"':''} onclick="flt='${f[0]}';result()">${f[1]}</button>`).join('')}</div></div>${rev}`}
if(!st)start();else if(st.phase==='done')result();else if(remain()<=0)submit(true);else run();
</script>
</body>
</html>
