<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRB JE CBT-1 Mock Test</title>
<style>
:root{--blue:#1f4e79;--hd:#0b3a63;--bg:#eef2f6;--card:#fff;--line:#c9d3de;--txt:#1b2733;--grn:#2e9b3e;--red:#d9462b;--pur:#6a3fa0;--gry:#d8dde3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--txt);background:var(--bg)}
button{font-family:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
.hdr{background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:17px;margin:0;font-weight:700}
.hdr .sub{font-size:12px;opacity:.85}
.timer{background:#fff;color:#111;border-radius:4px;padding:5px 12px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
.timer small{display:block;font-size:10px;font-weight:400;color:#555}
.timer.low{color:#fff;background:var(--red)}.timer.low small{color:#fff}
.tabs{display:flex;background:#dfe7ef;border-bottom:2px solid var(--blue);overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 14px;font-size:13px;font-weight:700;color:#234;white-space:nowrap;border-right:1px solid var(--line)}
.tab.on{background:var(--blue);color:#fff}
.main{flex:1;display:flex;min-height:0;min-width:0;overflow:hidden}
.qarea{flex:1;display:flex;flex-direction:column;min-width:0}
.qbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#f7f9fb;border-bottom:1px solid var(--line);font-size:13px}
.qbar b{font-size:15px}
.mk{font-size:12px}.mk span{color:var(--grn);font-weight:700}.mk em{color:var(--red);font-style:normal;font-weight:700}
.qbody{flex:1;overflow:auto;padding:12px 14px;background:var(--card)}
.qin{max-width:880px}
.opt{min-width:0}
.qbody img{display:block;max-width:100%;min-width:0;height:auto;-webkit-user-select:none;user-select:none}
.stem{margin-bottom:6px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;margin:8px 0;padding:2px 10px 2px 8px;max-width:880px;background:#fff}
.opt:hover{background:#f3f8fd}
.opt.sel{background:#e4f1fb;border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt .rd{flex:none;width:18px;height:18px;border:2px solid #667;border-radius:50%;position:relative}
.opt.sel .rd{border-color:var(--blue)}.opt.sel .rd:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--blue)}
.opt .ot{padding:4px 0;font-size:16px}
.lt{flex:none;font-size:15px;width:20px}
.tq{font-size:17px;line-height:1.6;margin-bottom:8px;max-width:880px;white-space:pre-wrap}
.act{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#f1f4f7;align-items:center}
.btn{border:1px solid #8a97a6;background:#fff;color:#123;padding:9px 14px;border-radius:3px;font-size:13px;font-weight:700}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.mar{background:#efe6f8;border-color:var(--pur);color:#3b1c63}
.btn.sub{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.dan{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.sp{flex:1}
.side{width:300px;background:#f4f7fa;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 6px;padding:10px;font-size:11px;border-bottom:1px solid var(--line)}
.legend div{display:flex;align-items:center;gap:6px}
.pal{flex:1;overflow:auto;padding:8px 10px}
.pal h4{margin:8px 0 6px;font-size:12px;color:#234;background:#dbe5ef;padding:4px 6px;border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pb{height:38px;border:1px solid #9aa6b3;background:var(--gry);font-weight:700;font-size:13px;color:#222;border-radius:5px 5px 14px 14px;position:relative}
.pb.s0{background:var(--gry)}
.pb.s1{background:var(--red);color:#fff;border-color:#a83018}
.pb.s2{background:var(--grn);color:#fff;border-color:#1f7a2c;border-radius:14px 14px 5px 5px}
.pb.s3{background:var(--pur);color:#fff;border-color:#4b2677;border-radius:50%}
.pb.s4{background:var(--pur);color:#fff;border-color:#4b2677;border-radius:50%}
.pb.s4:after{content:"";position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--grn);border:1.5px solid #fff}
.pb.cur{outline:3px solid #ffb300;outline-offset:1px}
.ic{display:inline-block;width:24px;height:22px;line-height:22px;text-align:center;font-size:11px;font-weight:700;color:#222;background:var(--gry);border:1px solid #9aa6b3;border-radius:4px 4px 10px 10px;flex:none}
.ic.s1{background:var(--red);color:#fff}.ic.s2{background:var(--grn);color:#fff;border-radius:10px 10px 4px 4px}.ic.s3,.ic.s4{background:var(--pur);color:#fff;border-radius:50%;position:relative}
.ic.s4:after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:var(--grn);border:1.5px solid #fff}
.sbtn{padding:10px;border-top:1px solid var(--line)}
.sbtn .btn{width:100%}
.mob{display:none}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,25,40,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.box{background:#fff;border-radius:8px;max-width:560px;width:100%;padding:20px;max-height:92vh;overflow:auto}
.box h2{margin:0 0 10px;font-size:19px;color:var(--hd)}
table.sm{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
table.sm td,table.sm th{border:1px solid var(--line);padding:7px 9px;text-align:left}
table.sm th{background:#eaf0f6}
.page{flex:1;overflow:auto;padding:18px;display:flex;justify-content:center}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px;max-width:860px;width:100%;height:max-content}
.card h2{margin:0 0 8px;color:var(--hd)}
.card ul{line-height:1.7;padding-left:20px}
.big{font-size:34px;font-weight:700;color:var(--hd)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.kpi div{background:#f2f6fa;border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--hd)}.kpi span{font-size:12px;color:#456}
.bad{color:var(--red)}
@media(max-width:820px){
 .side{position:fixed;top:0;right:0;bottom:0;width:86%;max-width:330px;z-index:40;transform:translateX(105%);transition:transform .2s;box-shadow:-4px 0 14px rgba(0,0,0,.3)}
 .side.open{transform:none}
 .mob{display:inline-block}
 .hdr h1{font-size:15px}.timer{font-size:16px;padding:4px 8px;min-width:90px}
 .btn{padding:9px 10px;font-size:12px}
 .opt .ot{font-size:15px}
 .qbody{padding:10px;overflow:auto}
 .qin{width:700px;max-width:none}
 .hdr{padding:6px 10px}
}
</style>
</head>

<div id="app"></div>
<script>
"use strict";
var DATA=[{"sec":0,"t":"txt","q":"पाइप A और B एक टंकी को 12 घंटे में भर सकते हैं, पाइप B और C उसी टंकी को 14 घंटे में भर सकते हैं तथा पाइप C और A उसी टंकी को 15 घंटे में भर सकते हैं। तीनों को एक साथ 6 घंटे के लिए खोल दिया जाता है, उसके बाद पाइप B और C को बंद कर दिया जाता है तथा पाइप A अकेला खुला रहता है। पाइप A द्वारा टंकी के शेष भाग को भरने में लिया गया समय ज्ञात कीजिए।","opts":["6 3⁄5 घंटे","7 4⁄9 घंटे","8 6⁄11 घंटे","9 5⁄13 घंटे"]},{"sec":0,"t":"txt","q":"एक परीक्षा में, वर्ग A के 16 विद्यार्थियों (50 में से) के प्राप्तांक 33, 41, 56, 51, 53, 46, 49, 41, 45, 56, 51, 49, 46, 41, 53, 33 हैं और वर्ग B के 13 विद्यार्थियों (50 में से) के प्राप्तांक 47, 54, 42, 50, 47, 39, 42, 52, 56, 49, 54, 39, 47 हैं। वर्ग B और वर्ग A के बहुलक के बीच का अंतर ज्ञात कीजिए।","opts":["5","7","10","6"]},{"sec":0,"t":"txt","q":"132 cm × 12 cm माप वाली कागज की एक आयताकार शीट को उसकी लंबाई के अनुदिश मोड़कर एक बेलन बनाया जाता है। इस प्रकार निर्मित बेलन का आयतन ज्ञात कीजिए।","opts":["16326 cm³","16623 cm³","16632 cm³","16362 cm³"]},{"sec":0,"t":"txt","q":"यदि (cosθ + sinθ) : (cosθ − sinθ) = (√3 + 1) : (√3 − 1), 0° < θ < 90° हो, तो tan(θ + 30°) ⁄ sec(θ − 30°) का मान ज्ञात कीजिए।","opts":["√3","√3⁄3","1","√3⁄2"]},{"sec":0,"t":"txt","q":"रेणु की वर्तमान आयु का 2 गुना, मानव की वर्तमान आयु के 4 गुने से 14 वर्ष अधिक है, तथा मानव की वर्तमान आयु का 5 गुना, रेणु की वर्तमान आयु के 2 गुने से 9 वर्ष कम है। रेणु तथा मानव की वर्तमान आयु का योगफल (वर्ष में) ज्ञात कीजिए।","opts":["18","22","27","20"]},{"sec":0,"t":"txt","q":"7 cm त्रिज्या वाले एक बेलनाकार टैंक में 2156 cm³ जल भरा जा सकता है। इसकी ऊंचाई ज्ञात कीजिए। (π = 22⁄7 का उपयोग कीजिए।)","opts":["8 cm","12 cm","10 cm","14 cm"]},{"sec":0,"t":"txt","q":"समरूप त्रिभुज ΔABC और ΔPQR की भुजाएं 6 : 5 के अनुपात में हैं। यदि ΔABC का क्षेत्रफल 72 cm² है, तो ΔPQR का क्षेत्रफल कितना होगा?","opts":["50 cm²","45 cm²","60 cm²","65 cm²"]},{"sec":0,"t":"txt","q":"75 तक की अभाज्य संख्याओं का योगफल ज्ञात कीजिए।","opts":["714","712","713","711"]},{"sec":0,"t":"txt","q":"नि   $("b-p").onclick=function(){go(S.cur-1);};$("b-n").onclick=function(){go(S.cur+1);};
  $("b-sub").onclick=confirmSubmit;
  $("pbtn").onclick=function(){$("side").classList.toggle("open");};
  renderQ();renderPal();startTimer();
}

function renderQ(){
  var i=S.cur,q=D(i),P=S.perm[i];
  S.vis[i]=1;
  $("qn").textContent="Question "+(i+1)+" of "+N;
  var h="";
  if(q.t==="img"){h+='<div class="stem"><img alt="Question '+(i+1)+'" src="'+q.s+'" draggable="false"></div>';
    for(var k=0;k<4;k++)h+='<div class="opt'+(S.ans[i]===k?" sel":"")+'" data-k="'+k+'"><span class="rd"></span><b class="lt">'+"ABCD".charAt(k)+'.</b><img alt="Option '+"ABCD".charAt(k)+'" src="'+q.o[P[k]]+'" draggable="false"></div>';}
  else{h+='<div class="tq">'+esc(q.q)+'</div>';
    for(var k2=0;k2<4;k2++)h+='<div class="opt'+(S.ans[i]===k2?" sel":"")+'" data-k="'+k2+'"><span class="rd"></span><span class="ot"><b>'+"ABCD".charAt(k2)+'.</b> '+esc(q.opts[P[k2]])+'</span></div>';}
  var qb=$("qb");qb.innerHTML='<div class="qin">'+h+'</div>';qb.scrollTop=0;
  var os=qb.querySelectorAll(".opt");
  for(var j=0;j<os.length;j++)os[j].onclick=(function(o){return function(){S.ans[S.cur]=+o.getAttribute("data-k");save();renderQ2();};})(os[j]);
  $("b-p").disabled=(i===0);$("b-n").disabled=(i===N-1);
  save();renderPal();
}
function renderQ2(){var os=$("qb").querySelectorAll(".opt");for(var j=0;j<os.length;j++)os[j].className="opt"+(S.ans[S.cur]===j?" sel":"");renderPal();}

function renderPal(){
  var c=counts();
  var lg='<div><span class="ic s2">'+c[2]+'</span>Answered</div><div><span class="ic s1">'+c[1]+'</span>Not Answered</div><div><span class="ic s0">'+c[0]+'</span>Not Visited</div><div><span class="ic s3">'+c[3]+'</span>Marked for Review</div><div style="grid-column:1/3"><span class="ic s4">'+c[4]+'</span>Answered &amp; Marked for Review</div>';
  $("lg").innerHTML=lg;
  var h="";
  h+='<h4>Question Palette</h4><div class="grid">';
  for(var i=0;i<N;i++)h+='<button class="pb s'+status(i)+(i===S.cur?" cur":"")+'" data-i="'+i+'">'+(i+1)+'</button>';
  h+='</div>';
  var p=$("pal");var st=p.scrollTop;p.innerHTML=h;p.scrollTop=st;
  var bs=p.querySelectorAll(".pb");for(var b=0;b<bs.length;b++)bs[b].onclick=(function(x){return function(){go(+x.getAttribute("data-i"));$("side").classList.remove("open");};})(bs[b]);
}

/* ---------- actions ---------- */
function go(i){if(i<0||i>=N)return;S.cur=i;renderQ();}
function saveNext(){S.mark[S.cur]=0;save();if(S.cur<N-1)go(S.cur+1);else{renderQ();}}
function markNext(){S.mark[S.cur]=1;save();if(S.cur<N-1)go(S.cur+1);else renderQ();}
function markOnly(){S.mark[S.cur]=S.mark[S.cur]?0:1;save();renderPal();}
function clearResp(){S.ans[S.cur]=-1;save();renderQ2();}

function confirmSubmit(){
  var c=counts();
  var ov=el('<div class="ov"><div class="box"><h2>Submit Test?</h2><p>Please review the summary before final submission.</p>'+
   '<table class="sm"><tr><th>Answered</th><th>Not Answered</th><th>Marked for Review</th><th>Answered &amp; Marked</th><th>Not Visited</th></tr><tr><td>'+c[2]+'</td><td>'+c[1]+'</td><td>'+c[3]+'</td><td>'+c[4]+'</td><td>'+c[0]+'</td></tr></table>'+
   '<p>Time left: <b>'+remainingText()+'</b></p><p class="bad"><b>You cannot change answers after submitting.</b></p>'+
   '<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" id="no">Go Back</button><button class="btn sub" id="yes">Yes, Submit</button></div></div></div>');
  document.body.appendChild(ov);
  $("no").onclick=function(){document.body.removeChild(ov);};
  $("yes").onclick=function(){document.body.removeChild(ov);finish(false);};
}

function compute(){
  var r={sec:[],total:N,att:0,cor:0,inc:0,un:0};
  for(var s=0;s<SEC.length;s++)r.sec.push({c:0,w:0,u:0,max:SEC[s].max});
  for(var i=0;i<N;i++){
    var sc=r.sec[secOf(i)];
    if(S.ans[i]<0){sc.u++;r.un++;}
    else if("ABCD".charAt(S.perm[i][S.ans[i]])===KEY.charAt(S.order[i])){sc.c++;r.cor++;r.att++;}
    else{sc.w++;r.inc++;r.att++;}
  }
  r.neg=r.inc/3;r.marks=r.cor-r.neg;r.acc=r.att?(r.cor/r.att*100):0;
  for(var t=0;t<r.sec.length;t++)r.sec[t].marks=r.sec[t].c-r.sec[t].w/3;
  return r;
}
function finish(auto){
  stopTimer();
  if(!S.done){S.done=true;S.auto=!!auto;S.res=compute();save();}
  showResult();
}
function showResult(){
  var r=S.res,app=$("app");
  var rows="";for(var s=0;s<SEC.length;s++){var x=r.sec[s];rows+='<tr><td>'+SEC[s].n+'</td><td>'+x.c+'</td><td>'+x.w+'</td><td>'+x.u+'</td><td><b>'+fmt(x.marks)+' / '+x.max+'</b></td></tr>';}
  app.innerHTML='<div class="hdr"><div><h1>RRB JE CBT-1 &ndash; Result</h1><div class="sub">'+(S.auto?"Time over: test auto-submitted":"Test submitted")+'</div></div></div>'+
  '<div class="page"><div class="card"><h2>Your Score</h2><div class="big">'+fmt(r.marks)+' <span style="font-size:18px;font-weight:400">/ 100</span></div>'+
  '<div class="kpi"><div><b>'+r.total+'</b><span>Total Questions</span></div><div><b>'+r.att+'</b><span>Attempted</span></div><div><b>'+r.cor+'</b><span>Correct</span></div><div><b>'+r.inc+'</b><span>Incorrect</span></div><div><b>'+r.un+'</b><span>Unattempted</span></div><div><b>'+fmt(r.neg)+'</b><span>Negative Marks Deducted</span></div><div><b>'+fmt(r.acc)+'%</b><span>Accuracy</span></div></div>'+
  '<p style="font-size:13px;color:#456">Final Score = Correct &minus; (Incorrect &divide; 3). Accuracy = Correct &divide; Attempted.</p>'+
  '<table class="sm"><tr><th>Section</th><th>Correct</th><th>Incorrect</th><th>Unattempted</th><th>Score</th></tr>'+rows+'</table>'+
  '<button class="btn pri" id="rt" style="padding:12px 26px;font-size:15px">Retake Test</button></div></div>';
  $("rt").onclick=function(){wipe();S=fresh();S.vis[0]=1;save();showExam();};
}

/* ---------- timer ---------- */
function remaining(){return Math.max(0,S.startTs+DUR-Date.now());}
function remainingText(){var s=Math.ceil(remaining()/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return (h?h+":":"")+pad(m)+":"+pad(s%60);}
function tick(){
  if(!S||S.done){stopTimer();return;}
  var rem=remaining();
  var tv=$("tmv");if(tv){var s=Math.ceil(rem/1000);tv.textContent=pad(Math.floor(s/60))+":"+pad(s%60);$("tm").className="timer"+(rem<=300000?" low":"");}
  if(rem<=0){var o=document.querySelector(".ov");while(o){document.body.removeChild(o);o=document.querySelector(".ov");}finish(true);}
}
function startTimer(){stopTimer();tick();timerH=setInterval(tick,500);}
function stopTimer(){if(timerH){clearInterval(timerH);timerH=null;}}

/* ---------- boot ---------- */
(function(){
  var s=load();
  if(s&&s.ans&&s.ans.length===N&&s.order){
    S=s;
    if(S.done){showResult();return;}
    if(remaining()<=0){finish(true);return;}
    showExam();
  }else showStart();
})();
window.addEventListener("beforeunload",function(){if(S&&!S.done)save();});
</script>
</body>
</html>
